name: 'Build Android app - Develop'
defaults:
  run:
    working-directory: ally-mobile

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download Firebase config from S3 (Android Dev)
        run: |
          mkdir -p android/app/src/dev
          aws s3 cp "${{ secrets.ANDROID_GOOGLE_SERVICES_S3_URI_DEV }}" "android/app/src/dev/google-services.json"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ally-mobile/package-lock.json

      - name: Install dependencies
        run: |
          npm i -g corepack
          npm ci

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ally-mobile/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_VALUES_DEVELOP }}" > .env

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/ally-release.keystore

      - name: Build with Gradle (Development)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleDevRelease --stacktrace

      - name: Rename APK with build number, date, and env
        run: |
          DATETIME=$(date +'%Y%m%d-%H%M')
          mv android/app/build/outputs/apk/dev/release/app-dev-release.apk android/app/build/outputs/apk/dev/release/app-develop-release-${{ github.run_number }}-${DATETIME}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-develop-release-${{ github.run_number }}
          path: ally-mobile/android/app/build/outputs/apk/dev/release/app-develop-release-${{ github.run_number }}-*.apk
          retention-days: 7

      - name: Send Slack notification
        if: success()
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: 'Android Development Build #${{ github.run_number }} Successful!'
          attachments: |
            [
              {
                "color": "good",
                "author_name": "${{ github.actor }}",
                "author_icon": "${{ github.event.sender.avatar_url }}",
                "fields": [
                  {
                    "title": "What's New",
                    "value": "${{ github.event.head_commit.message }}"
                  },
                  {
                    "title": "Download Develop APK",
                    "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click Here>"
                  }
                ]
              }
            ]
