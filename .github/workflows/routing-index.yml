name: Routing index

# wiki/ROUTING.md and wiki/manifest.json are generated from page frontmatter, and the
# code folders carry copies (ROUTING.md, <service>/ROUTING.md, <service>/WIKI-ROUTING.md)
# so agents there can pick a page without fetching the whole wiki. In the monorepo
# gen-routing.py writes those copies itself; this asserts all of them are current.
# Fix a failure with: python3 helloallytech.github.io/scripts/gen-routing.py
#
# See https://tech.helloally.ai/#/wiki/contributing/docs-system.md

on:
  pull_request:
    paths:
      - "helloallytech.github.io/wiki/**"
      - "helloallytech.github.io/scripts/gen-routing.py"
      - "ROUTING.md"
      - "*/ROUTING.md"
      - "*/WIKI-ROUTING.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert generated index and its copies are current
        run: python3 helloallytech.github.io/scripts/gen-routing.py --check
