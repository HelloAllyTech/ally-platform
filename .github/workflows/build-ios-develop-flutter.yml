# Test build of the Flutter app under its own identity
# (com.helloally.allyMobileFlutter, "Ally Flutter"), so installing it never
# replaces the real Ally app. Mirrors this repo's build-ios-develop.yml
# with the same secret names, plus PROVISION_PROFILE_DEV_BASE64 (this bundle
# id needs its own App Store profile). Uploads to the TestFlight app of that
# bundle id; see ally-mobile-flutter/docs/RELEASE.md for the one-time App
# Store Connect setup.
name: 'Build & Upload iOS app - Develop (Flutter, test identity)'

defaults:
  run:
    working-directory: ally-mobile-flutter

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_ios:
    runs-on: macos-15
    environment: development
    timeout-minutes: 60
    env:
      # `secrets` can't be read in a step `if:`; job env can.
      IOS_GSI_URI: ${{ secrets.IOS_GOOGLE_SERVICES_S3_URI_DEV }}

    steps:
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: env.IOS_GSI_URI != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download Firebase config from S3 (iOS Dev, optional)
        # RN's dev plist is for com.helloally.app; this identity needs its own
        # Firebase iOS app. Without a matching one the build has no Firebase
        # (push/Crashlytics), which the app tolerates.
        if: env.IOS_GSI_URI != ''
        run: |
          aws s3 cp "$IOS_GSI_URI" "ios/Runner/GoogleService-Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" ios/Runner/GoogleService-Info.plist || true)
          if [ "$BUNDLE" != "com.helloally.allyMobileFlutter" ]; then
            echo "::warning::GoogleService-Info.plist is for $BUNDLE, not com.helloally.allyMobileFlutter; building without Firebase"
            rm -f ios/Runner/GoogleService-Info.plist
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_VALUES_DEVELOP }}" > .env

      - name: Set up iOS code signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_DEV_BASE64: ${{ secrets.PROVISION_PROFILE_DEV_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$PROVISION_PROFILE_DEV_BASE64" ]; then
            echo "::error::PROVISION_PROFILE_DEV_BASE64 is not set (App Store profile 'Ally Flutter AppStore Distribution' for com.helloally.allyMobileFlutter; ally-mobile-flutter/docs/RELEASE.md)"
            exit 1
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/AppProvision.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISION_PROFILE_DEV_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Set build number
        id: increment_version
        # RN's develop scheme: YYYYMMDDHHMM.
        run: |
          build_number=$(date +%Y%m%d%H%M)
          echo "build_number=$build_number" >> $GITHUB_OUTPUT

      - name: Write export options
        # Not a secret: the profile name for this bundle id and RN's team.
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>W3ZL4N9N9J</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.helloally.allyMobileFlutter</key>
              <string>Ally Flutter AppStore Distribution</string>
            </dict>
          </dict>
          </plist>
          PLIST
          plutil -lint $RUNNER_TEMP/ExportOptions.plist

      - name: Build ipa (dev flavor)
        run: |
          flutter build ipa --release --flavor dev --obfuscate --split-debug-info=build/symbols \
            --dart-define-from-file=.env \
            --build-number=${{ steps.increment_version.outputs.build_number }} \
            --export-options-plist=$RUNNER_TEMP/ExportOptions.plist
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa produced"
            exit 1
          fi
          mkdir -p $RUNNER_TEMP/build
          cp "$IPA" $RUNNER_TEMP/build/ally-flutter-dev.ipa

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-develop
          path: ${{ runner.temp }}/build/ally-flutter-dev.ipa
          retention-days: 7

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@master
        with:
          app-path: ${{ runner.temp }}/build/ally-flutter-dev.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Keep Dart debug symbols
        # Obfuscated Dart stack traces can only be read with these; kept so a
        # build can still be symbolicated after the Firebase secret is added.
        uses: actions/upload-artifact@v4
        with:
          name: dart-symbols-${{ github.run_number }}
          path: ally-mobile-flutter/build/symbols
          retention-days: 90

      - name: Upload Crashlytics symbols
        # Best effort, never fails the release: skipped with a warning when
        # the Firebase config or the Firebase service account is missing.
        # Native: the archive's dSYMs (the "Upload Crashlytics Symbols" build
        # phase also tries, but its upload can race dSYM generation).
        # Dart: the --split-debug-info files from the obfuscated build.
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_CRASHLYTICS_SERVICE_ACCOUNT_JSON }}
        run: |
          GSP=ios/Runner/GoogleService-Info.plist
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$GSP" 2>/dev/null || true)
          if [ -z "$APP_ID" ]; then
            echo "::warning::No GoogleService-Info.plist; skipping Crashlytics symbol upload"
            exit 0
          fi
          # flutter build clones Swift packages into build/ios/SourcePackages.
          UPLOAD=$(ls build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols \
            "$HOME"/Library/Developer/Xcode/DerivedData/Runner-*/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols \
            2>/dev/null | head -n 1)
          if [ -n "$UPLOAD" ] && [ -d build/ios/archive/Runner.xcarchive/dSYMs ]; then
            "$UPLOAD" -gsp "$GSP" -p ios build/ios/archive/Runner.xcarchive/dSYMs \
              || echo "::warning::dSYM upload failed"
          else
            echo "::warning::Crashlytics upload-symbols or the archive dSYMs not found; skipping dSYM upload"
          fi
          if [ -z "$FIREBASE_SA" ]; then
            echo "::warning::FIREBASE_CRASHLYTICS_SERVICE_ACCOUNT_JSON not set; skipping Dart symbol upload"
            exit 0
          fi
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            npx --yes firebase-tools@14 crashlytics:symbols:upload --app="$APP_ID" build/symbols
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Send Slack notification
        if: success()
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: 'Flutter iOS test build (Ally Flutter) uploaded to TestFlight. Build ${{ steps.increment_version.outputs.build_number }}.'
