name: Tests (ally-mobile-rn-archive)

# Archived alongside ally-mobile/ itself (now Flutter) — manual-dispatch only
# rather than on every push/PR, since nothing should be actively committing
# to the archived RN app. Kept runnable by hand as a sanity check before an
# emergency RN rollback build (see ally-mobile/docs/RELEASE.md's Rollback
# section).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-ally-mobile-rn-archive-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ally-mobile-rn-archive

jobs:
  test:
    name: Jest (ally-mobile-rn-archive)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ally-mobile-rn-archive/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  lint:
    name: Lint & format (ally-mobile-rn-archive)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ally-mobile-rn-archive/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck (ally-mobile-rn-archive)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ally-mobile-rn-archive/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
