name: Tests (ally-mobile)

on:
  pull_request:
    branches: [master]
    paths:
      - "ally-mobile/**"
  push:
    branches: [master]
    paths:
      - "ally-mobile/**"

permissions:
  contents: read

concurrency:
  group: tests-ally-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ally-mobile

jobs:
  test:
    name: Jest (ally-mobile)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ally-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  lint:
    name: Lint & format (ally-mobile)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ally-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck (ally-mobile)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ally-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
