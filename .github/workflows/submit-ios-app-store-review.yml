name: Submit iOS for App Store review
#
# The highest-stakes workflow in this repo: submits the current App Store Connect listing +
# latest TestFlight build for Apple's FULL App Store review — real public distribution, not
# TestFlight. workflow_dispatch-only (never a `push`/`schedule` trigger of its own), but IS now
# auto-triggered — build-ios-production.yml dispatches this automatically after a successful
# build when scheduled-mobile-release.yml passed it auto_submit_app_store=true, which only
# happens on a genuine unattended cron tick (see that workflow's own comment on the exact
# trigger step for why manual "Trigger release now" clicks are deliberately excluded from this
# escalation). Guards against firing on top of an already-in-flight submission itself, inside
# scripts/submit-ios-app-store-review.mjs — see hasActiveReviewSubmission() there — so this is
# safe to call repeatedly/automatically, not just once by a careful human.
#
# If no version is ready in App Store Connect, the script creates the next one and carries the
# previous version's en-US listing forward onto it (text fields as-is, screenshots re-uploaded
# byte-for-byte since Apple's API has no "reuse existing screenshot" call) — this only makes
# "identical to last time" free, not "different this time"; a human still updates the listing in
# App Store Connect when it actually needs to change. Export compliance is never answered here.
# DOES auto-release once approved: the script forces releaseType to AFTER_APPROVAL, so the
# moment Apple approves this submission, it goes live to every real App Store user — no
# further human click required.

on:
  workflow_dispatch:
    inputs:
      whats_new:
        description: "\"What's New in This Version\" text (optional - leave blank to keep whatever is already set in App Store Connect)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: submit-ios-app-store-review
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install jsonwebtoken (CI-only tooling, not an app dependency)
        run: npm install jsonwebtoken --no-save

      - name: Submit for App Store review
        id: submit
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # Passed as an env var, never interpolated straight into the run: line — this is
          # admin-typed free text, and ${{ }}-interpolating untrusted input directly into a
          # shell command is a real injection risk. Same pattern build-android-production.yml
          # already uses for its release-notes input.
          WHATS_NEW_TEXT: ${{ inputs.whats_new }}
        run: node scripts/submit-ios-app-store-review.mjs

      - name: Notify Slack - submitted for App Store review
        if: success() && steps.submit.outputs.skipped != 'true'
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: "iOS version ${{ steps.submit.outputs.version_string }} submitted for Apple's full App Store review (triggered by ${{ github.actor }}). Release is set to AFTER_APPROVAL — the moment Apple approves it, it goes live to every real App Store user automatically, no further action needed."

      - name: Notify Slack - skipped, a submission is already in progress
        if: success() && steps.submit.outputs.skipped == 'true'
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: "iOS App Store review dispatch (triggered by ${{ github.actor }}) skipped itself — Apple is already actively processing a previous submission for this app. Nothing was submitted; check App Store Connect for the one already in flight."

      - name: Notify Slack - submission failed
        if: failure()
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: 'iOS App Store review submission FAILED (triggered by ${{ github.actor }}). <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run logs>'
