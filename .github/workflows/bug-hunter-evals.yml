# Bug Hunter v2 — eval harness (docs/bug-hunter/chunks/chunk-04.md)
#
# Manual only. Runs the golden cases in bug-hunter/evals/golden/cases.yaml on a
# GitHub runner, where disk and CPU are not the developer's laptop:
#   1. oracle check  — prove each bug case: its oracle tests fail at the parent
#                      commit and pass once the real fix's source diff is applied
#                      (writes bug-hunter/evals/golden/oracle-status.json)
#   2. evals         — an agent (baseline = never finds anything, or graph = the
#                      real graph) in issue and sweep mode, under a hard cost cap
#
# Every case runs in a throwaway git worktree with the app's tests inside the
# bug-hunter Docker sandbox (one case at a time; worktree removed after each).
# Results, oracle-status.json and the kept per-run artefacts (scrubbed test
# excerpts, patches, result.json) are uploaded as workflow artifacts; nothing is
# committed by this workflow. Locally, run single cases only (`make eval CASES=<id>`).
#
# Secrets (repo): OPENAI_API_KEY, GEMINI_API_KEY (exported as GOOGLE_API_KEY, the name
# langchain-google-genai reads), LANGSMITH_API_KEY (tracing in project ally-bug-hunter).
# The baseline agent uses none of them; the graph agent needs the first two.

name: Bug Hunter v2 evals

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case filter: app, kind (bug/clean) or id; comma-separated. Empty = all."
        required: false
        default: ""
        type: string
      what:
        description: "Which part to run"
        required: false
        default: "all"
        type: choice
        options: [all, oracle, baseline]
      agent:
        description: "Agent for the baseline steps: baseline (no model) or graph (chunk 05)"
        required: false
        default: "baseline"
        type: choice
        options: [baseline, graph]
      max_cost_usd:
        description: "Hard cost cap for each eval run (default from limits.yaml: 10)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: bug-hunter-evals
  cancel-in-progress: false

defaults:
  run:
    working-directory: bug-hunter

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
  LANGSMITH_TRACING: "true"
  LANGSMITH_PROJECT: ally-bug-hunter
  # The graph agent checkpoints into the Postgres service below (the real code path).
  BUGHUNTER_EVAL_CHECKPOINT: postgres
  BUGHUNTER_CHECKPOINT_DB_URL: postgresql://bughunter:bughunter@localhost:5433/bughunter

jobs:
  evals:
    name: Oracle check + baseline
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: bughunter
          POSTGRES_PASSWORD: bughunter
          POSTGRES_DB: bughunter
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bughunter -d bughunter"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      # The sandbox builds four images (~5 GB) and one dependency volume per
      # distinct lockfile across the cases' history (ally-web's is 1.3 GB each).
      # The harness stops itself below `evals.min_free_gb` (limits.yaml), so buy
      # the space up front. Runs before setup-python: tool-cache removal wipes the
      # preinstalled Pythons.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          # The cases check out commits from the whole history, including the
          # pre-cutover subtree histories; a shallow clone has none of them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install bug-hunter
        run: make install
      - name: Offline unit tests
        run: make test
      - name: Validate config
        run: poetry run bug-hunter config check

      - name: Disk and Docker before
        run: |
          df -h /
          docker system df
          docker version --format 'docker {{.Server.Version}}'

      - name: Plan (distinct lockfiles per app)
        run: |
          poetry run bug-hunter eval run --dry-run ${CASES:+--cases "$CASES"}
        env:
          CASES: ${{ inputs.cases }}

      - name: Oracle check
        if: inputs.what == 'all' || inputs.what == 'oracle'
        run: |
          poetry run bug-hunter eval run --oracle-check ${CASES:+--cases "$CASES"}
        env:
          CASES: ${{ inputs.cases }}

      - name: Eval, issue mode
        if: always() && (inputs.what == 'all' || inputs.what == 'baseline')
        run: |
          poetry run bug-hunter eval run --agent "$AGENT" --mode issue ${CASES:+--cases "$CASES"} ${MAX_COST:+--max-cost-usd "$MAX_COST"}
        env:
          CASES: ${{ inputs.cases }}
          AGENT: ${{ inputs.agent }}
          MAX_COST: ${{ inputs.max_cost_usd }}

      - name: Eval, sweep mode
        if: always() && (inputs.what == 'all' || inputs.what == 'baseline')
        run: |
          poetry run bug-hunter eval run --agent "$AGENT" --mode sweep ${CASES:+--cases "$CASES"} ${MAX_COST:+--max-cost-usd "$MAX_COST"}
        env:
          CASES: ${{ inputs.cases }}
          AGENT: ${{ inputs.agent }}
          MAX_COST: ${{ inputs.max_cost_usd }}

      - name: Disk and Docker after
        if: always()
        run: |
          df -h /
          docker system df
          poetry run bug-hunter cache size || true

      - name: Upload reports and oracle status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-hunter-eval-results-${{ github.run_number }}
          path: |
            bug-hunter/evals/results/
            bug-hunter/evals/golden/oracle-status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload per-run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-hunter-run-artefacts-${{ github.run_number }}
          path: bug-hunter/runs/artefacts/
          if-no-files-found: warn
          retention-days: 14
