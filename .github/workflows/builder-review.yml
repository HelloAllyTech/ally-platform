# Builder's code review of a pull request, run here with the code checked out.
# The logic is in builder-review-opencode.yml.
# Started by Builder (or by hand, as a dry run without review_run_id).
name: Builder review
# The review run id is in the title: one workflow reviews every service's pull
# requests, and ally-be finds a review's run by it (builderRunTitle).
run-name: "Builder review #${{ inputs.pr_number }} · run ${{ inputs.review_run_id || 'dry' }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to review
        required: true
      spec_run_id:
        description: Builder build run whose spec the pull request was built from
        required: true
      review_run_id:
        description: Builder review run to file the verdict to (empty = dry run)
        required: false
        default: ''
      builder_pr_id:
        description: Builder's id for the pull request (needed to file findings)
        required: false
        default: ''
      service:
        description: The service the pull request is for (empty = the folder holding most of its files)
        required: false
        default: ''

concurrency:
  group: builder-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/builder-review-opencode.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      spec_run_id: ${{ inputs.spec_run_id }}
      review_run_id: ${{ inputs.review_run_id }}
      builder_pr_id: ${{ inputs.builder_pr_id }}
      service: ${{ inputs.service }}
    secrets: inherit
