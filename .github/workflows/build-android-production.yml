name: 'Build Android app - Production'
defaults:
  run:
    working-directory: ally-mobile

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes (What is New)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download Firebase config from S3 (Android Prod)
        run: |
          mkdir -p android/app/src/prod
          aws s3 cp "${{ secrets.ANDROID_GOOGLE_SERVICES_S3_URI_PROD }}" "android/app/src/prod/google-services.json"

      - name: Install Java
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ally-mobile/package-lock.json

      - name: Install dependencies
        run: |
          npm i -g corepack
          npm ci

      - name: Cache Gradle Wrapper
        uses: actions/cache@v3
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ally-mobile/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_VALUES_PRODUCTION }}" > .env

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/ally-release.keystore

      - name: Build with Gradle (Production)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew clean --stacktrace
          # Build APK
          ./gradlew assembleProdRelease --stacktrace
          # Build AAB (App Bundle)
          ./gradlew bundleProdRelease --stacktrace

      - name: Rename APK with build number, date, and env
        run: |
          DATETIME=$(date +'%Y%m%d-%H%M')
          APK_SRC="android/app/build/outputs/apk/prod/release/app-prod-release.apk"
          APK_DST="android/app/build/outputs/apk/prod/release/app-production-release-${{ github.run_number }}-${DATETIME}.apk"
          if [ -f "$APK_SRC" ]; then
            mv "$APK_SRC" "$APK_DST"
          else
            echo "APK not found at $APK_SRC"
            ls -R android/app/build/outputs/apk || true
            exit 1
          fi

      - name: Rename AAB with build number, date, and env
        id: rename_aab
        run: |
          DATETIME=$(date +'%Y%m%d-%H%M')
          # Expected AAB path for flavor 'prod' and buildType 'release'
          AAB_SRC="android/app/build/outputs/bundle/prodRelease/app-prod-release.aab"
          AAB_DST="android/app/build/outputs/bundle/prod/release/app-production-release-${{ github.run_number }}-${DATETIME}.aab"
          if [ -f "$AAB_SRC" ]; then
            mkdir -p "$(dirname "$AAB_DST")"
            mv "$AAB_SRC" "$AAB_DST"
            # `with:` inputs resolve from the workspace root, not the ally-mobile default
            echo "aab_path=ally-mobile/$AAB_DST" >> $GITHUB_OUTPUT
          else
            echo "AAB not found at $AAB_SRC"
            ls -R android/app/build/outputs/bundle || true
            exit 1
          fi

      - name: Extract Version Information
        id: version_info
        run: |
          VERSION_CODE=$(grep "versionCode" android/app/build.gradle | awk '{print $2}')
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | awk '{print $2}' | tr -d '"')
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p distribution/whatsnew
          echo "$RELEASE_NOTES" > distribution/whatsnew/whatsnew-en-US

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: com.helloally.app
          releaseFiles: ${{ steps.rename_aab.outputs.aab_path }}
          track: internal
          status: completed
          releaseName: '${{ steps.version_info.outputs.version_code }} (${{ steps.version_info.outputs.version_name }})'
          whatsNewDirectory: ally-mobile/distribution/whatsnew

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release-apk-${{ github.run_number }}
          path: ally-mobile/android/app/build/outputs/apk/prod/release/app-production-release-${{ github.run_number }}-*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release-aab-${{ github.run_number }}
          path: ally-mobile/android/app/build/outputs/bundle/prod/release/app-production-release-${{ github.run_number }}-*.aab
          retention-days: 30

      - name: Send Slack notification (Production)
        if: success()
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: 'Android Production Build #${{ github.run_number }} Successful!'
          attachments: |
            [
              {
                "color": "good",
                "author_name": "${{ github.actor }}",
                "author_icon": "${{ github.event.sender.avatar_url }}",
                "fields": [
                  {
                    "title": "What's New",
                    "value": "${{ github.event.head_commit.message }}"
                  },
                  {
                    "title": "Download Production APK",
                    "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click Here>"
                  }
                ]
              }
            ]
