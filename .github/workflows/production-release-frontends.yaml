# Production Release Pipeline - Frontends (helpline + admin dashboards)
#
# One pipeline for both dashboards (frontend consolidation Phase 3). The two
# apps stay fully separate - own tests, own build, own build-time env, own
# login - and only meet at deploy time on web-prod (metal01), where
# app.helloally.ai serves the helpline dashboard and app.helloally.ai/admin/
# the admin dashboard.
#
# Required GitHub Variables: PRD_AWS_ROLE, PRD_AWS_REGION, ALLY_API_BASE_URL
# Required secrets: METAL01_ANSIBLE_SSH_KEY, INFRA_DEPLOY_KEY, ANSIBLE_VAULT_PASSWORD,
#                   OPENAI_API_KEY, ALLY_API_KEY (translations)
#
# Usage: Actions -> "Production Release - Frontends" -> Run workflow
#   version_tag: frontend-v{major}.{minor}.{patch} (one shared tag for both apps)
#   apps:        both (default) | helpline | admin
#
# Each app builds in its own job so neither app's .env can leak into the
# other's build. Nothing deploys unless every selected app's tests and build
# pass; helpline deploys first, then admin.
name: Production Release - Frontends
defaults:
  run:
    working-directory: ally-web

permissions:
  id-token: write
  contents: write  # Required for creating releases and tags

# Never run two frontend releases at once (two deploys racing on web-prod).
concurrency:
  group: production-release-frontends
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version_tag:
        required: true
        type: string
        description: 'Version tag (e.g., frontend-v1.0.0, frontend-v1.2.3)'
      apps:
        required: true
        type: choice
        default: both
        options:
          - both
          - helpline
          - admin
        description: 'Which dashboards to release'

jobs:
  validate-and-tag:
    name: Validate Version and Create Tag
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      VERSION: ${{ steps.parse-version.outputs.VERSION }}
      MAJOR: ${{ steps.parse-version.outputs.MAJOR }}
      MINOR: ${{ steps.parse-version.outputs.MINOR }}
      PATCH: ${{ steps.parse-version.outputs.PATCH }}
      TAG: ${{ steps.parse-version.outputs.TAG }}
      SHIP_HELPLINE: ${{ steps.parse-version.outputs.SHIP_HELPLINE }}
      SHIP_ADMIN: ${{ steps.parse-version.outputs.SHIP_ADMIN }}

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Parse and validate version
        id: parse-version
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          APPS="${{ github.event.inputs.apps }}"
          echo "Processing tag: $TAG (apps: $APPS)"

          if [[ ! $TAG =~ ^frontend-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Tag must be in format frontend-v{major}.{minor}.{patch} (e.g., frontend-v1.0.0)"
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Error: Tag $TAG already exists"
            exit 1
          fi

          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^frontend-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

          if [ -n "$LATEST_TAG" ]; then
            echo "Latest existing tag: $LATEST_TAG"
            HIGHER=$(printf "%s\n%s" "$LATEST_TAG" "$TAG" | sort -V | tail -n 1)
            if [ "$HIGHER" != "$TAG" ]; then
              echo "❌ Error: Tag $TAG is not newer than the latest tag $LATEST_TAG"
              exit 1
            fi
            echo "✅ Version validation passed: $TAG is newer than $LATEST_TAG"
          else
            echo "ℹ️  No previous frontend-v tags found. This will be the first unified release."
          fi

          case "$APPS" in
            both)     SHIP_HELPLINE=true;  SHIP_ADMIN=true ;;
            helpline) SHIP_HELPLINE=true;  SHIP_ADMIN=false ;;
            admin)    SHIP_HELPLINE=false; SHIP_ADMIN=true ;;
            *) echo "❌ Error: unknown apps value '$APPS'"; exit 1 ;;
          esac

          VERSION=${TAG#frontend-v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "MAJOR=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "MINOR=$(echo $VERSION | cut -d. -f2)" >> $GITHUB_OUTPUT
          echo "PATCH=$(echo $VERSION | cut -d. -f3)" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "SHIP_HELPLINE=$SHIP_HELPLINE" >> $GITHUB_OUTPUT
          echo "SHIP_ADMIN=$SHIP_ADMIN" >> $GITHUB_OUTPUT

          echo "## :rocket: Release Version - Frontends" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous Tag**: ${LATEST_TAG:-none (first unified release)}" >> $GITHUB_STEP_SUMMARY
          echo "- **Helpline dashboard**: $SHIP_HELPLINE" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin dashboard**: $SHIP_ADMIN" >> $GITHUB_STEP_SUMMARY

      - name: Create and push tag
        run: |
          TAG="${{ steps.parse-version.outputs.TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release frontends (${{ github.event.inputs.apps }}) version ${{ steps.parse-version.outputs.VERSION }}"
          git push origin "$TAG"
          echo "✅ Tag $TAG created and pushed" >> $GITHUB_STEP_SUMMARY

  prepare-env:
    name: Prepare Production Environment
    needs: validate-and-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      aws_region: ${{ steps.env-vars.outputs.aws_region }}
      s3_env_bucket: ${{ steps.cdn-helpline.outputs.s3_env_bucket }}
      helpline_service_path: ${{ steps.cdn-helpline.outputs.service_path }}
      admin_service_path: ${{ steps.cdn-admin.outputs.service_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set Environment Variables
        id: env-vars
        uses: ./.github/actions/ally-web/aws/set-environment-vars
        with:
          environment: prd
          prd_aws_role: ${{ secrets.PRD_AWS_ROLE }}
          prd_aws_region: ${{ vars.PRD_AWS_REGION }}

      - name: Set CDN Variables (helpline)
        id: cdn-helpline
        uses: ./.github/actions/ally-web/aws/set-cdn-vars
        with:
          service_name: "helpline-dashboard"
          project_prefix: ${{ steps.env-vars.outputs.project_prefix }}
          project_region: ${{ steps.env-vars.outputs.project_region }}

      - name: Set CDN Variables (admin)
        id: cdn-admin
        uses: ./.github/actions/ally-web/aws/set-cdn-vars
        with:
          service_name: "admin-dashboard"
          project_prefix: ${{ steps.env-vars.outputs.project_prefix }}
          project_region: ${{ steps.env-vars.outputs.project_region }}

  # ---------------------------------------------------------------- helpline

  test-helpline:
    name: Test Helpline Dashboard
    needs: [validate-and-tag, prepare-env]
    if: needs.validate-and-tag.outputs.SHIP_HELPLINE == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NX_NO_CLOUD: true
      NX_SKIP_NX_CACHE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ally-web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: |
          echo ":test_tube: Running tests for ally-helpline-dashboard..." >> $GITHUB_STEP_SUMMARY
          npm run test:helpline
          npm run test:ui-shared
          echo ":white_check_mark: Helpline tests passed" >> $GITHUB_STEP_SUMMARY

  i18n-sync-and-publish:
    name: Sync and Publish Translations
    needs: [validate-and-tag, prepare-env]
    if: needs.validate-and-tag.outputs.SHIP_HELPLINE == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ally-web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Sync translations
        run: npm run i18n:sync -- ${{ secrets.OPENAI_API_KEY }}

      - name: Publish translations to API
        run: npm run i18n:publish
        env:
          ALLY_API_BASE_URL: ${{ vars.ALLY_API_BASE_URL }}
          ALLY_API_KEY: ${{ secrets.ALLY_API_KEY }}

  build-helpline:
    name: Build Helpline Dashboard
    needs: [validate-and-tag, prepare-env, test-helpline, i18n-sync-and-publish]
    if: needs.validate-and-tag.outputs.SHIP_HELPLINE == 'true'
    runs-on: ubuntu-22.04
    env:
      NX_NO_CLOUD: true
      NX_SKIP_NX_CACHE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PRD_AWS_ROLE }}
          aws-region: ${{ needs.prepare-env.outputs.aws_region }}

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Download Environment Variables
        run: |
          echo ":gear: Downloading helpline build-time environment variables..." >> $GITHUB_STEP_SUMMARY
          if aws s3 cp s3://${{ needs.prepare-env.outputs.s3_env_bucket }}/${{ needs.prepare-env.outputs.helpline_service_path }}/.env apps/ally-helpline-dashboard/.env 2>/dev/null; then
            echo ":white_check_mark: Environment variables downloaded successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo ":information_source: No build-time environment variables found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Application
        working-directory: ally-web/apps/ally-helpline-dashboard
        env:
          NODE_ENV: production
        run: |
          echo ":hammer: Building ally-helpline-dashboard (frontend v${{ needs.validate-and-tag.outputs.VERSION }})..." >> $GITHUB_STEP_SUMMARY
          npm run build
          echo ":white_check_mark: Helpline build completed" >> $GITHUB_STEP_SUMMARY

      - name: Pack assets tarball
        run: |
          tar -czf "$GITHUB_WORKSPACE/helpline-assets.tar.gz" -C apps/ally-helpline-dashboard/dist .
          echo ":package: helpline $(du -h "$GITHUB_WORKSPACE/helpline-assets.tar.gz" | cut -f1) tarball packed" >> $GITHUB_STEP_SUMMARY

      - name: Upload assets tarball
        uses: actions/upload-artifact@v4
        with:
          name: helpline-assets
          path: helpline-assets.tar.gz
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------- admin

  test-admin:
    name: Test Admin Dashboard
    needs: [validate-and-tag, prepare-env]
    if: needs.validate-and-tag.outputs.SHIP_ADMIN == 'true'
    runs-on: ubuntu-22.04
    env:
      NX_NO_CLOUD: true
      NX_SKIP_NX_CACHE: true
      NX_CLOUD_ACCESS_TOKEN: ""
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ally-web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests with Coverage
        run: |
          echo ":test_tube: Running tests for ally-admin-dashboard..." >> $GITHUB_STEP_SUMMARY
          NODE_OPTIONS="--max-old-space-size=5120" npx nx test ally-admin-dashboard
          echo ":white_check_mark: Admin tests passed" >> $GITHUB_STEP_SUMMARY

  build-admin:
    name: Build Admin Dashboard
    needs: [validate-and-tag, prepare-env, test-admin]
    if: needs.validate-and-tag.outputs.SHIP_ADMIN == 'true'
    runs-on: ubuntu-22.04
    env:
      NX_NO_CLOUD: true
      NX_SKIP_NX_CACHE: true
      NX_CLOUD_ACCESS_TOKEN: ""
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PRD_AWS_ROLE }}
          aws-region: ${{ needs.prepare-env.outputs.aws_region }}

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Download Environment Variables
        run: |
          echo ":gear: Downloading admin build-time environment variables..." >> $GITHUB_STEP_SUMMARY
          if aws s3 cp s3://${{ needs.prepare-env.outputs.s3_env_bucket }}/${{ needs.prepare-env.outputs.admin_service_path }}/.env apps/ally-admin-dashboard/.env 2>/dev/null; then
            echo ":white_check_mark: Environment variables downloaded successfully" >> $GITHUB_STEP_SUMMARY
            cp apps/ally-admin-dashboard/.env .env
          else
            echo ":information_source: No build-time environment variables found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Application
        env:
          NODE_ENV: production
          # Production serves the admin app under app.helloally.ai/admin/
          # (frontend consolidation Phase 2). Everything - asset URLs, router
          # basename, <base> tag - derives from this one value.
          VITE_BASE_PATH: /admin/
        run: |
          echo ":hammer: Building ally-admin-dashboard (frontend v${{ needs.validate-and-tag.outputs.VERSION }})..." >> $GITHUB_STEP_SUMMARY
          npx nx build ally-admin-dashboard
          echo ":white_check_mark: Admin build completed" >> $GITHUB_STEP_SUMMARY

      - name: Pack assets tarball
        run: |
          tar -czf "$GITHUB_WORKSPACE/admin-assets.tar.gz" -C dist/apps/ally-admin-dashboard .
          echo ":package: admin $(du -h "$GITHUB_WORKSPACE/admin-assets.tar.gz" | cut -f1) tarball packed" >> $GITHUB_STEP_SUMMARY

      - name: Upload assets tarball
        uses: actions/upload-artifact@v4
        with:
          name: admin-assets
          path: admin-assets.tar.gz
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------ deploy
  # Deploys run only after EVERY selected app built: a broken admin build
  # never leaves helpline half-released. !cancelled() && !failure() lets a job
  # run when the other app's jobs were skipped (not selected).

  deploy-helpline:
    name: Deploy Helpline Dashboard
    needs: [validate-and-tag, build-helpline, build-admin]
    if: ${{ !cancelled() && !failure() && needs.validate-and-tag.outputs.SHIP_HELPLINE == 'true' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download assets tarball
        uses: actions/download-artifact@v4
        with:
          name: helpline-assets
          path: ${{ github.workspace }}

      - name: Deploy helpline dashboard via Ansible
        uses: ./.github/actions/deploy-metal01
        with:
          playbook: ally_helpline.yml
          extra-args: >-
            -e vite_static_site_local_tarball=${{ github.workspace }}/helpline-assets.tar.gz
          ssh-key: ${{ secrets.METAL01_ANSIBLE_SSH_KEY }}
          infra-deploy-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Verify site
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://app.helloally.ai)
          if [ "$code" != "200" ]; then
            echo "::error::app.helloally.ai returned $code after deploy"
            exit 1
          fi
          echo "✅ app.helloally.ai serving 200" >> $GITHUB_STEP_SUMMARY

  deploy-admin:
    name: Deploy Admin Dashboard
    needs: [validate-and-tag, build-helpline, build-admin, deploy-helpline]
    if: ${{ !cancelled() && !failure() && needs.validate-and-tag.outputs.SHIP_ADMIN == 'true' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download assets tarball
        uses: actions/download-artifact@v4
        with:
          name: admin-assets
          path: ${{ github.workspace }}

      - name: Deploy admin dashboard via Ansible
        uses: ./.github/actions/deploy-metal01
        with:
          playbook: ally_admin.yml
          extra-args: >-
            -e vite_static_site_local_tarball=${{ github.workspace }}/admin-assets.tar.gz
          ssh-key: ${{ secrets.METAL01_ANSIBLE_SSH_KEY }}
          infra-deploy-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Verify site
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://app.helloally.ai/admin/)
          if [ "$code" != "200" ]; then
            echo "::error::app.helloally.ai/admin/ returned $code after deploy"
            exit 1
          fi
          redirect=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://admin.helloally.ai)
          if [ "$redirect" != "301" ] && [ "$redirect" != "308" ]; then
            echo "::error::admin.helloally.ai returned $redirect (expected a permanent redirect)"
            exit 1
          fi
          echo "✅ app.helloally.ai/admin/ serving 200; admin.helloally.ai redirects ($redirect)" >> $GITHUB_STEP_SUMMARY

  # ----------------------------------------------------------------- release

  create-release:
    name: Create Release Draft
    needs: [validate-and-tag, deploy-helpline, deploy-admin]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          TAG=${{ needs.validate-and-tag.outputs.TAG }}
          git fetch origin tag "$TAG"

          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^frontend-v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$TAG$" | head -n 1)

          # Per-app range start: the previous unified tag, else (first unified
          # release) that app's last tag from its old standalone pipeline.
          range_start() {
            local legacy_prefix="$1"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "$PREVIOUS_TAG"
              return
            fi
            local legacy
            legacy=$(git tag --sort=-v:refname | grep -E "^${legacy_prefix}-v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1)
            echo "${legacy:-$(git rev-list --max-parents=0 HEAD)}"
          }

          echo "## What's Changed" > CHANGELOG.md
          if [ "${{ needs.validate-and-tag.outputs.SHIP_HELPLINE }}" = "true" ]; then
            START=$(range_start helpline)
            echo "" >> CHANGELOG.md
            echo "### Helpline dashboard (since $START)" >> CHANGELOG.md
            git log "$START"..master --pretty=format:"- %s (%h) @%an" --no-merges -- apps/ally-helpline-dashboard libs | head -100 >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          if [ "${{ needs.validate-and-tag.outputs.SHIP_ADMIN }}" = "true" ]; then
            START=$(range_start admin)
            echo "" >> CHANGELOG.md
            echo "### Admin dashboard (since $START)" >> CHANGELOG.md
            git log "$START"..master --pretty=format:"- %s (%h) @%an" --no-merges -- apps/ally-admin-dashboard libs | head -100 >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          DELIMITER="CHANGELOG_END_$(date +%s)"
          echo "CHANGELOG<<${DELIMITER}" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Release Frontends v${{ needs.validate-and-tag.outputs.VERSION }}
          tag_name: ${{ needs.validate-and-tag.outputs.TAG }}
          body: |
            ## Release Frontends v${{ needs.validate-and-tag.outputs.VERSION }}

            ### Version Information
            - **Apps released**: ${{ github.event.inputs.apps }} (helpline: ${{ needs.validate-and-tag.outputs.SHIP_HELPLINE }}, admin: ${{ needs.validate-and-tag.outputs.SHIP_ADMIN }})
            - **Version**: ${{ needs.validate-and-tag.outputs.VERSION }}

            ### Deployment Information
            - **Environment**: Production
            - **Branch**: master
            - **Deployment Type**: metal01 web-prod via Ansible `ally_helpline.yml` / `ally_admin.yml` (Caddy static sites)

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            **Note**: This release is created as a draft. Publishing it is a manual step and
            changes nothing operationally — the deployment described above has already run.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
