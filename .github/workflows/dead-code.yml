name: Dead code

# Keeps unused code from piling up. Two halves (spec: scripts/dead_code.py):
#   * PR gate  — fails if the PR ADDS dead code that is not in scripts/dead-code-baseline.json.
#                Existing debt never blocks anyone; only new debt does.
#   * Weekly   — publishes the findings, grouped by module, to the PM Agent, which can turn
#                a module into a roadmap card. The roadmap is the cleanup queue.
#
# Python repos (ally-ai, ally-ai-learn) are scanned with vulture, TypeScript repos (ally-be,
# ally-web) with knip, which is a pinned devDependency of each repo (never `npx -y`).
#
# Jobs are split so an unrelated PR never pays for a scan it cannot affect:
#   dead-code     Python gate (always runs when this workflow triggers; ~1 min)
#   changes       decides, from the PR's file list, which TypeScript scans are needed
#   dead-code-be  ally-be gate   (Node 24, like test-ally-be.yml)
#   dead-code-web ally-web gate  (Node 22, per ally-web/.nvmrc)
#   script-tests  unit tests for the orchestrator's parsers
#   publish       weekly / manual only: every enabled repo -> PM Agent

on:
  pull_request:
    paths:
      - "ally-ai/app/**"
      - "ally-ai-learn/app/**"
      - "ally-be/src/**"
      - "ally-be/scripts/**"
      - "ally-be/knip.json"
      - "ally-be/package.json"
      - "ally-be/package-lock.json"
      - "ally-web/apps/**"
      - "ally-web/libs/**"
      - "ally-web/scripts/**"
      - "ally-web/knip.json"
      - "ally-web/package.json"
      - "ally-web/package-lock.json"
      - "scripts/dead_code.py"
      - "scripts/test_dead_code.py"
      - "scripts/fixtures/knip-sample.json"
      - "scripts/dead-code*.json"
      - ".github/workflows/dead-code.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dead-code:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'vulture==2.14'

      - name: Scan
        id: scan
        run: |
          set -uo pipefail
          for repo in ally-ai ally-ai-learn; do
            python3 scripts/dead_code.py --repo "$repo" --check > "report-$repo.md"
            echo "$repo=$?" >> status.txt
          done
          cat report-*.md | tee full-report.md >> "$GITHUB_STEP_SUMMARY"
          ! grep -q '=1' status.txt

  # Which TypeScript scans does this PR need? Asked of the PR's file list (no checkout, no
  # third-party action). Anything that is not a PR (schedule, manual) scans everything.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      be: ${{ steps.filter.outputs.be }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "be=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
          # The scanner, its config, its baseline and this workflow affect every repo.
          shared='^(scripts/(dead_code\.py|dead-code[^/]*\.json)|\.github/workflows/dead-code\.yml)$'
          be='^ally-be/(src/|scripts/|knip\.json$|package(-lock)?\.json$)'
          web='^ally-web/(apps/|libs/|scripts/|knip\.json$|package(-lock)?\.json$)'
          grep -Eq "$shared|$be" files.txt && echo "be=true" >> "$GITHUB_OUTPUT" || echo "be=false" >> "$GITHUB_OUTPUT"
          grep -Eq "$shared|$web" files.txt && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  dead-code-be:
    needs: changes
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ally-be/package-lock.json
      # --ignore-scripts: knip only reads source; no install script is needed to scan it.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ally-be
      - name: Scan
        run: |
          set -uo pipefail
          python3 scripts/dead_code.py --repo ally-be --check > report.md
          rc=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  dead-code-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ally-web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ally-web
      - name: Scan
        run: |
          set -uo pipefail
          python3 scripts/dead_code.py --repo ally-web --check > report.md
          rc=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  script-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts/test_dead_code.py -v

  # Weekly / manual only: a PR never publishes. Scans every enabled repo, so it installs
  # vulture and both repos' dependencies. The report goes to ally-be, which stores it as PM
  # Agent evidence; the PM Agent's code_health lane may turn a module into a card, and an
  # admin accepting that card files the roadmap ticket. Same secret and variable
  # bug-hunt-sweep.yml uses to reach ally-be. Skips cleanly (warning) when they are unset.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check publish config
        id: cfg
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
          ALLY_BE_API_URL: ${{ vars.ALLY_BE_API_URL }}
        run: |
          if [ -z "$ALLY_BE_API_URL" ] || [ -z "$ALLY_BE_API_KEY" ]; then
            echo "::warning::ALLY_BE_API_URL / ALLY_BE_API_KEY not set; dead code was not published."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.cfg.outputs.ready == 'true'
        run: pip install 'vulture==2.14'

      # Node 24 for ally-be, then 22 for ally-web (each repo's own version for its install);
      # the scan then runs on 22, which both knip configs were tuned on.
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ally-be/package-lock.json
      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ally-be
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ally-web/package-lock.json
      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ally-web

      - name: Publish modules to the PM Agent
        if: steps.cfg.outputs.ready == 'true'
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
          ALLY_BE_API_URL: ${{ vars.ALLY_BE_API_URL }}
        run: python3 scripts/dead_code.py --publish
