name: Publish Developer Wiki (tech.helloally.ai)

# Automatically mirrors the helloallytech.github.io/ directory from ally-platform
# to the public GitHub Pages repository (HelloAllyTech/helloallytech.github.io)
# whenever wiki docs change on master, keeping https://tech.helloally.ai live
# with zero DNS or infrastructure changes.

on:
  push:
    branches: [master, main]
    paths:
      - "helloallytech.github.io/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror Wiki to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ally-platform
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mint token for GitHub Pages repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
          owner: HelloAllyTech
          repositories: helloallytech.github.io

      - name: Publish to HelloAllyTech/helloallytech.github.io
        env:
          WIKI_REMOTE_URL: "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/HelloAllyTech/helloallytech.github.io.git"
        run: |
          git config --global user.name "ally-docs-bot[bot]"
          git config --global user.email "314168265+ally-docs-bot[bot]@users.noreply.github.com"
          ./scripts/publish-wiki.sh
