# Builder works issues labelled `builder` into pull requests with opencode.
# The logic is in builder-opencode.yml, which also works out which service an
# issue or pull request is for: since the 2026-10-23 monorepo cutover this one
# workflow builds all five.
# Only org members can drive it: the label needs write access, and a `/oc`
# comment is acted on only from an owner, member or collaborator.
name: Builder
# The issue or pull request number and the event are in the title: ally-be
# finds a build's run by them (builderIssueRunTitle), because every Builder
# issue and every `/oc` comment in the monorepo runs this same workflow.
run-name: "Builder #${{ github.event.issue.number }} (${{ github.event_name }})"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: builder-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'builder') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')))
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/builder-opencode.yml
    secrets: inherit
