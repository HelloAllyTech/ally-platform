name: Tests (ally-ai-learn)

on:
  pull_request:
    branches: [master]
    paths:
      - "ally-ai-learn/**"
  push:
    branches: [master]
    paths:
      - "ally-ai-learn/**"

permissions:
  contents: read

concurrency:
  group: tests-ally-ai-learn-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ally-ai-learn

jobs:
  test:
    name: pytest (ally-ai-learn)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --no-interaction --with dev
      - name: Run tests
        run: poetry run python -m pytest tests/ -v

  lint:
    name: Lint & format (ally-ai-learn)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --no-interaction --with dev
      - name: Lint
        run: poetry run flake8
