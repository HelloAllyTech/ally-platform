name: 'Build & Upload iOS app - Production'

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_ios_production:
    runs-on: macos-15
    environment: production

    steps:
      - name: Set up Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download Firebase config from S3 (iOS Prod)
        run: |
          aws s3 cp "${{ secrets.IOS_GOOGLE_SERVICES_S3_URI_PROD }}" "ios/GoogleService-Info.plist"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Download react-native-audio-api prebuilt binaries
        run: |
          cd node_modules/react-native-audio-api
          chmod +x scripts/download-prebuilt-binaries.sh
          scripts/download-prebuilt-binaries.sh ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
          key: pods-cache-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-cache-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_VALUES_PRODUCTION }}" > .env

      - name: Set up iOS code signing (Production)
        env:
          # TODO: Update these secrets to the production ones
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILES_BASE64: ${{ secrets.PROVISION_PROFILES_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/AppProvision.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISION_PROFILES_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Set build version (Production)
        id: increment_version
        run: |
          set -e
          cd ios
          which agvtool
          agvtool what-version
          # Add "1" prefix for production builds to distinguish from develop builds
          build_number="1$(date +%Y%m%d%H%M)"
          echo "Production build number: $build_number"
          agvtool new-version -all $build_number
          agvtool what-version
          echo "build_number=$build_number" >> $GITHUB_OUTPUT

      - name: Add production build metadata
        run: |
          cd ios
          # Add custom build metadata to Info.plist
          plutil -insert BuildEnvironment -string "Production" ally/Info.plist
          plutil -insert BuildType -string "Release" ally/Info.plist
          echo "✅ Added production build metadata"

      - name: Build archive
        run: |
          cd ios
          xcodebuild -workspace ally.xcworkspace \
            -scheme ally \
            -configuration Release \
            -archivePath $RUNNER_TEMP/ally.xcarchive \
            -allowProvisioningUpdates \
            clean archive

      - name: Validate .xcarchive contents
        run: |
          if [ ! -d "$RUNNER_TEMP/ally.xcarchive/Products/Applications/ally.app" ]; then
            echo "❌ Archive failed: ally.app missing"
            ls -R $RUNNER_TEMP/ally.xcarchive
            exit 1
          fi
          echo "✅ Production archive looks good"

      - name: Export ipa (Production)
        env:
          EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
        run: |
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist
          echo -n "$EXPORT_OPTIONS_PLIST" | base64 --decode -o $EXPORT_OPTS_PATH
          plutil -lint $EXPORT_OPTS_PATH

          echo "=== Production Archive Info.plist ==="
          plutil -p $RUNNER_TEMP/ally.xcarchive/Info.plist || cat $RUNNER_TEMP/ally.xcarchive/Info.plist

          echo "Starting production export..."
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/ally.xcarchive \
            -exportOptionsPlist $EXPORT_OPTS_PATH \
            -exportPath $RUNNER_TEMP/build \
            -allowProvisioningUpdates \
            -verbose | tee $RUNNER_TEMP/export.log

          echo "Production export complete!"
          ls -l $RUNNER_TEMP/build

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-production-app
          path: ${{ runner.temp }}/build/ally.ipa
          retention-days: 30

      - name: Upload to TestFlight (Production)
        uses: Apple-Actions/upload-testflight-build@master
        with:
          app-path: ${{ runner.temp }}/build/ally.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Send Slack notification (Production)
        if: success()
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: iOS Production Build & TestFlight Upload Successful!
          attachments: |
            [
              {
                "color": "good",
                "author_name": "${{ github.actor }}",
                "author_icon": "${{ github.event.sender.avatar_url }}",
                "fields": [
                  {
                    "title": "What's New",
                    "value": "${{ github.event.head_commit.message }}"
                  },
                  {
                    "title": "Build Number",
                    "value": "${{ steps.increment_version.outputs.build_number }}"
                  },
                  {
                    "title": "Download IPA Artifact",
                    "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click Here>"
                  }
                ]
              }
            ]

      # Automatically hands the just-uploaded build to external TestFlight testers — no separate
      # manual click. Deliberately non-blocking (continue-on-error): the actual build + TestFlight
      # upload above already succeeded by this point, and a hiccup in this bonus step (e.g. a
      # transient Apple API error, or missing export-compliance info on this specific build)
      # shouldn't retroactively mark the whole production build as failed. Its own Slack
      # notifications below carry the real signal either way.
      - name: Set up Node for TestFlight external submission
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install jsonwebtoken (CI-only tooling, not an app dependency)
        if: success()
        run: npm install jsonwebtoken --no-save

      - name: Submit to TestFlight external group
        if: success()
        id: submit_external
        continue-on-error: true
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          TESTFLIGHT_EXTERNAL_GROUP_NAME: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP_NAME }}
        run: node scripts/promote-ios-testflight.mjs

      - name: Notify Slack - submitted to TestFlight external group
        if: success() && steps.submit_external.outcome == 'success'
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: "iOS build automatically submitted to the TestFlight external group. Apple's Beta App Review still needs to clear (typically ~24h) before external testers can install it."

      - name: Notify Slack - automatic TestFlight external submission failed
        if: success() && steps.submit_external.outcome == 'failure'
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: 'iOS build uploaded successfully, but automatic TestFlight external submission FAILED — needs a manual retry (promote-ios-testflight-external.yml, or the admin dashboard button). <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run logs>'
