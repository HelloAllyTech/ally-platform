name: 'Build & Upload iOS app - Develop'
defaults:
  run:
    working-directory: ally-mobile

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_ios:
    runs-on: macos-15
    environment: development

    steps:
      - name: Verify Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download Firebase config from S3 (iOS Dev)
        run: |
          aws s3 cp "${{ secrets.IOS_GOOGLE_SERVICES_S3_URI_DEV }}" "ios/GoogleService-Info.plist"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ally-mobile/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Download react-native-audio-api prebuilt binaries
        run: |
          cd node_modules/react-native-audio-api
          chmod +x scripts/download-prebuilt-binaries.sh
          scripts/download-prebuilt-binaries.sh ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
          key: pods-cache-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-cache-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_VALUES_DEVELOP }}" > .env

      - name: Set up iOS code signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILES_BASE64: ${{ secrets.PROVISION_PROFILES_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/AppProvision.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISION_PROFILES_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Set build version (auto-increment)
        id: increment_version
        run: |
          set -e
          cd ios
          which agvtool
          agvtool what-version
          build_number=$(date +%Y%m%d%H%M)
          echo "New build number: $build_number"
          agvtool new-version -all $build_number
          agvtool what-version
          echo "build_number=$build_number" >> $GITHUB_OUTPUT

      - name: Update app display name for dev version
        run: |
          cd ios
          # Update Info.plist to show "Ally(Develop)" in TestFlight
          plutil -replace CFBundleDisplayName -string "Ally(Develop)" ally/Info.plist
          echo "✅ Updated app display name to 'Ally(Develop)'"

      - name: Build archive
        run: |
          cd ios
          xcodebuild -workspace ally.xcworkspace \
            -scheme ally \
            -configuration Release \
            -archivePath $RUNNER_TEMP/ally.xcarchive \
            -allowProvisioningUpdates \
            clean archive

      - name: Validate .xcarchive contents
        run: |
          if [ ! -d "$RUNNER_TEMP/ally.xcarchive/Products/Applications/ally.app" ]; then
            echo "❌ Archive failed: ally.app missing"
            ls -R $RUNNER_TEMP/ally.xcarchive
            exit 1
          fi
          echo "✅ Archive looks good"

      - name: Export ipa
        env:
          EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
        run: |
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist
          echo -n "$EXPORT_OPTIONS_PLIST" | base64 --decode -o $EXPORT_OPTS_PATH
          plutil -lint $EXPORT_OPTS_PATH

          echo "=== Archive Info.plist ==="
          plutil -p $RUNNER_TEMP/ally.xcarchive/Info.plist || cat $RUNNER_TEMP/ally.xcarchive/Info.plist

          echo "Starting export..."
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/ally.xcarchive \
            -exportOptionsPlist $EXPORT_OPTS_PATH \
            -exportPath $RUNNER_TEMP/build \
            -allowProvisioningUpdates \
            -verbose | tee $RUNNER_TEMP/export.log

          echo "Export complete!"
          ls -l $RUNNER_TEMP/build

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ${{ runner.temp }}/build/ally.ipa
          retention-days: 7

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@master
        with:
          app-path: ${{ runner.temp }}/build/ally.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Send Slack notification
        if: success()
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: iOS Develop Build & TestFlight Upload Successful!
          attachments: |
            [
              {
                "color": "good",
                "author_name": "${{ github.actor }}",
                "author_icon": "${{ github.event.sender.avatar_url }}",
                "fields": [
                  {
                    "title": "What's New",
                    "value": "${{ github.event.head_commit.message }}"
                  },
                  {
                    "title": "Build Number",
                    "value": "${{ steps.increment_version.outputs.build_number }}"
                  },
                  {
                    "title": "Download IPA Artifact",
                    "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click Here>"
                  }
                ]
              }
            ]
