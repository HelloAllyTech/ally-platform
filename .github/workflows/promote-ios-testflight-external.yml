name: Submit iOS build to TestFlight external testers
#
# Manual-only. Assigns the latest processed TestFlight build (uploaded by
# build-ios-production.yml) to the external testers beta group. This only triggers Apple's own
# Beta App Review for that build — Apple's review is asynchronous (~24h typical) and outside our
# control, so this workflow's job ends at "submitted", not "available". Never auto-triggered by
# scheduled-mobile-release.yml, same reasoning as the Android promotion workflow.
#
# Requires the TESTFLIGHT_EXTERNAL_GROUP_NAME repo variable to be set to the exact name of an
# existing external testing group in App Store Connect.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-ios-testflight-external
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install jsonwebtoken (CI-only tooling, not an app dependency)
        run: npm install jsonwebtoken --no-save

      - name: Submit to TestFlight external group
        id: submit
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          TESTFLIGHT_EXTERNAL_GROUP_NAME: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP_NAME }}
        run: node scripts/promote-ios-testflight.mjs

      - name: Notify Slack - submitted to TestFlight external group
        if: success()
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: "iOS build ${{ steps.submit.outputs.build_version }} submitted to the TestFlight external group (triggered by ${{ github.actor }}). Apple's Beta App Review still needs to clear (typically ~24h) before external testers can install it."

      - name: Notify Slack - submission failed
        if: failure()
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: 'iOS TestFlight external submission FAILED (triggered by ${{ github.actor }}). <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run logs>'
