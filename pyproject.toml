[tool.poetry]
name = "ally-learn-core"
version = "0.1.0"
description = "Core service for Ally Learn POC - A learning platform designed for mental health counselors and organizations, providing training content management, professional development tracking, and therapeutic resource delivery."
authors = ["risal-kv <119860563+risal-kv@users.noreply.github.com>"]
license = "Proprietary"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4"
fastapi = ">=0.116.1,<0.117.0"
pydantic-settings = ">=2.10.1,<3.0.0"
uvicorn = ">=0.35.0,<0.36.0"
livekit-api = ">=1.0.3,<2.0.0"
livekit = ">=1.0.11,<2.0.0"
livekit-agents = {version = ">=1.2,<2.0", extras = ["deepgram", "elevenlabs", "openai", "sarvam", "turn-detector"]}
livekit-plugins-noise-cancellation = "^0.2.5"
slack-sdk = "^3.36.0"
greenlet = "^3.2.3"
boto3 = "^1.40.2"
pydantic = {extras = ["email"], version = "^2.11.7"}
langgraph = "^0.6.7"
livekit-plugins-langchain = "^1.2.8"
langchain-openai = "^0.3.33"
livekit-plugins-openai = "~1.2"
livekit-plugins-deepgram = "~1.2"
livekit-plugins-silero = "~1.2"
livekit-plugins-elevenlabs = "^1.2.9"
sarvamai = "^0.1.21"
deepgram-sdk = "^5.2.0"
elevenlabs = "^2.20.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"