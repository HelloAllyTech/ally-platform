# Which documentation covers which code across the ally-platform monorepo.
#
# Read by the shared docs-guard workflow on every PR, and by the weekly wiki reconciler.
# Because helloallytech.github.io/ lives inside this monorepo, `wiki:<page>` rules can now
# also be satisfied by directly touching `helloallytech.github.io/wiki/<page>` in the same PR!
#
# Escape hatch: add the `docs:skip` label, or a `Wiki-PR: none — <reason>` / `Docs-Skip:` trailer.

version: 1
repo: ally-platform

rules:
  # ── Sub-project Agent Entrypoints ───────────────────────────────────────
  - id: ally-be-agent-entrypoints-in-sync
    watch:
      - "ally-be/AGENTS.md"
      - "ally-be/CLAUDE.md"
    requires: mirror
    why: >
      ally-be/AGENTS.md and ally-be/CLAUDE.md must stay byte-identical.

  - id: ally-web-agent-entrypoints-in-sync
    watch:
      - "ally-web/AGENTS.md"
      - "ally-web/CLAUDE.md"
    requires: mirror
    why: >
      ally-web/AGENTS.md and ally-web/CLAUDE.md must stay byte-identical.

  - id: ally-ai-agent-entrypoints-in-sync
    watch:
      - "ally-ai/AGENTS.md"
      - "ally-ai/CLAUDE.md"
    requires: mirror
    why: >
      ally-ai/AGENTS.md and ally-ai/CLAUDE.md must stay byte-identical.

  - id: ally-ai-learn-agent-entrypoints-in-sync
    watch:
      - "ally-ai-learn/AGENTS.md"
      - "ally-ai-learn/CLAUDE.md"
    requires: mirror
    why: >
      ally-ai-learn/AGENTS.md and ally-ai-learn/CLAUDE.md must stay byte-identical.

  - id: ally-mobile-agent-entrypoints-in-sync
    watch:
      - "ally-mobile/AGENTS.md"
      - "ally-mobile/CLAUDE.md"
    requires: mirror
    why: >
      ally-mobile/AGENTS.md and ally-mobile/CLAUDE.md must stay byte-identical.

  - id: ally-archiver-agent-entrypoints-in-sync
    watch:
      - "ally-archiver/AGENTS.md"
      - "ally-archiver/CLAUDE.md"
    requires: mirror
    why: >
      ally-archiver/AGENTS.md and ally-archiver/CLAUDE.md must stay byte-identical.

  # ── ally-archiver ───────────────────────────────────────────────────────
  - id: ally-archiver-wiki
    watch:
      - "ally-archiver/cmd/**"
      - "ally-archiver/internal/**/*.go"
    requires: helloallytech.github.io/wiki/repos/ally-archiver.md
    why: >
      repos/ally-archiver.md documents the commands, packages, object states and safety
      defaults; a change to how objects move or what the UI does must reach it, and a change to
      the plan itself belongs in platform/storage-archive.md. A test-only change can use
      the `Docs-Skip:` trailer.

  # ── ally-be ─────────────────────────────────────────────────────────────
  - id: ally-be-data-schema
    watch:
      - "ally-be/src/**/entity/*.entity.ts"
    requires: ally-be/DATA_SCHEMA.md
    why: >
      DATA_SCHEMA.md is the platform-wide map of what data exists and where. An entity
      change that skips it makes the map wrong for every service that reads it.

  - id: ally-be-repo-page-architecture
    watch:
      - "ally-be/src/app.module.ts"
      - "ally-be/src/**/*.gateway.ts"
      - "ally-be/src/main.ts"
    requires: helloallytech.github.io/wiki/repos/ally-be.md
    why: >
      Module wiring and WebSocket gateways are the service's public shape; the repo page
      describes it to every other service and to agents.

  - id: prompt-conventions
    watch:
      - "ally-be/src/prompt/contracts/define-prompt.ts"
      - "ally-be/src/prompt/contracts/index.ts"
      - "ally-be/src/prompt/service/prompts-sync.service.ts"
      - "ally-ai/scripts/sync_prompts.py"
      - "ally-ai-learn/scripts/sync_prompts.py"
    requires: ally-be/docs/adding-a-prompt.md
    why: >
      How a prompt is declared (its contract and Skills Store details) and synced is the
      recipe every developer and agent follows to add one. Adding a prompt doesn't change
      the conventions, so it needs no doc change; changing how contracts or sync work does.

  - id: ally-be-context-library-mcp
    watch:
      - "ally-be/src/context-library/controller/context-library-mcp.controller.ts"
    requires: helloallytech.github.io/wiki/contributing/planning-with-context-library.md
    why: >
      Engineers' Claude Code reaches the Context Library only through this MCP server, and the
      wiki page is where its tools, the prompt, the key and the setup are written down. Every
      repo's `context-library` skill and CLAUDE.md point there, so a changed tool that skips it
      teaches every agent the old one.

  - id: ally-be-weak-metrics-definitions
    watch:
      - "ally-be/src/analytics/repository/weak-metrics-analytics.repository.ts"
    requires: ally-be/docs/weak-metrics-queries.md
    why: >
      That repository holds both the metric definitions and the deterministic thresholds
      the dashboard reads.

  - id: ally-be-ai-task-registry
    watch:
      - "ally-be/src/**/service/*-ai.service.ts"
      - "ally-be/src/**/service/*autofill*.service.ts"
      - "ally-be/src/**/service/*-orchestrator.service.ts"
      - "ally-be/src/**/provider/*.ts"
      - "ally-be/src/**/providers/*.ts"
      - "ally-be/src/learn/enum/llm-task.enum.ts"
    requires: ally-be/src/llm/constants/ai-task-registry.constants.ts
    why: >
      The AI task registry is the one place that says which platform actions call a model
      and which model each one uses.

  - id: ally-be-language-glossary-architecture
    watch:
      - "ally-be/src/language/**"
    requires: ally-be/docs/LANGUAGE_GLOSSARY_DESIGN.md
    why: >
      The glossary is an unattended loop; the architecture doc is the only place
      the cadences, gates and irreversibility rules are written down.

  # ── ally-web ────────────────────────────────────────────────────────────
  - id: ally-web-posthog-events
    watch:
      - "ally-web/apps/**/analytics/**"
      - "ally-web/apps/**/*posthog*"
    requires: ally-web/docs/current-posthog-events-traking-list.md
    why: >
      The tracked-event list is the only inventory of what analytics the product emits.

  - id: ally-web-repo-page-apps
    watch:
      - "ally-web/apps/*/project.json"
      - "ally-web/nx.json"
      - "ally-web/libs/ui-shared/src/index.ts"
    requires: helloallytech.github.io/wiki/repos/ally-web.md
    why: >
      App inventory, ports and the shared-library surface are what the platform docs rely on.

  # ── ally-ai ─────────────────────────────────────────────────────────────
  - id: ally-ai-vector-collections
    watch:
      - "ally-ai/app/core/vector_db/constants.py"
      - "ally-ai/app/migrations/**"
      - "ally-ai/app/core/context_library/collection_schema.py"
    requires: helloallytech.github.io/wiki/repos/ally-ai.md
    why: >
      Weaviate collections are cross-service state — ally-be's DATA_SCHEMA.md points at this
      file as the source of truth for the vector side of the platform. The Context Library's
      `Ctx<Collection>_v{N}` collections are created on demand from `collection_schema.py`
      rather than by a migration, so that file is watched too.

  - id: ally-ai-repo-page-architecture
    watch:
      - "ally-ai/app/main.py"
      - "ally-ai/app/api/v1/endpoints/**"
    requires: helloallytech.github.io/wiki/repos/ally-ai.md
    why: The HTTP surface is what ally-be integrates against; the repo page documents it.

  - id: debrief-harness-contract
    watch:
      - "ally-ai/app/core/debrief_graph/schemas.py"
      - "ally-ai/app/core/debrief_graph/gateway.py"
      - "ally-ai/app/core/ask_ally/schemas.py"
      - "ally-ai/app/core/ask_ally/agent.py"
      - "ally-ai/app/core/ask_ally/tools.py"
      - "ally-be/src/debrief/service/debrief-run-token.service.ts"
      - "ally-be/src/debrief/service/debrief-gateway.service.ts"
      - "ally-be/src/debrief/service/ask-ally.client.ts"
      - "ally-ai/app/core/pm_agent/schemas.py"
      - "ally-ai/app/core/pm_agent/tools.py"
      - "ally-be/src/debrief/service/debrief-pm-agent-tools.service.ts"
      - "ally-be/src/debrief/service/debrief-pm-agent-run.service.ts"
    requires: docs/debrief-harness/CONTRACT.md
    why: >
      The run and reply requests, the stream events, the gateway tools and the run
      tokens are a contract between ally-be and ally-ai; each side is built and
      deployed separately, so a change on one side without the contract moving
      leaves the other guessing.

  - id: ally-ai-filler-eval-schema
    watch:
      - "ally-ai/app/core/filler_quality/**"
    requires: ally-ai/docs/filler-eval-judge-schema.md
    why: >
      The finding typology is a contract with ally-be, which persists these rows and
      computes the rates from them.

  # ── ally-ai-learn ───────────────────────────────────────────────────────
  - id: ally-ai-learn-event-types
    watch:
      - "ally-ai-learn/app/core/events/event_types/**"
      - "ally-ai-learn/app/core/events/factory.py"
    requires: ally-ai-learn/docs/04-event-types-reference.md
    why: >
      The event-type reference enumerates every detection type.

  - id: ally-ai-learn-providers
    watch:
      - "ally-ai-learn/app/tts/**"
      - "ally-ai-learn/app/stt/**"
      - "ally-ai-learn/app/llms/**"
    requires:
      any_of:
        - ally-ai-learn/docs/05-tts-providers.md
        - ally-ai-learn/docs/06-stt-providers.md
        - ally-ai-learn/docs/07-llm-providers.md
    why: Each provider family has a doc listing the supported providers and their config.

  - id: ally-ai-learn-graph-pipeline
    watch:
      - "ally-ai-learn/app/core/graph/**"
    requires: ally-ai-learn/docs/02-graph-pipeline.md
    why: The LangGraph node order and state shape are documented, not inferable at a glance.

  - id: ally-ai-learn-repo-page-architecture
    watch:
      - "ally-ai-learn/app/worker.py"
      - "ally-ai-learn/app/main.py"
    requires: helloallytech.github.io/wiki/repos/ally-ai-learn.md
    why: Worker lifecycle and entry points are what the platform-level docs describe.

  # ── ally-mobile (Flutter — repoints to its own paths since the 2026-11 rename,
  #    which also deleted the archived RN app) ─────────────────────────────
  - id: ally-mobile-repo-page-shape
    watch:
      - "ally-mobile/lib/core/routing/**"
      - "ally-mobile/lib/core/network/**"
    requires: helloallytech.github.io/wiki/repos/ally-mobile.md
    why: >
      Routing and the API-client layer are what the repo page describes. The wiki page
      itself still describes the now-deleted RN app — rewriting it for Flutter is a
      separate, not-yet-done task.

  - id: ally-mobile-release-process
    watch:
      - "ally-mobile/android/app/build.gradle.kts"
      - "ally-mobile/ios/**/Info.plist"
      - "ally-mobile/pubspec.yaml"
    requires:
      any_of:
        - ally-mobile/README.md
        - ally-mobile/docs/RELEASE.md
    why: >
      Version and build-number handling is the step people get wrong at release time.
