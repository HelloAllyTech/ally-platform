name: Routing index

# wiki/ROUTING.md and wiki/manifest.json are generated from page frontmatter.
# On a PR we assert they are current; on main we regenerate and fan the index out to
# every code repo so agents there can pick a page without fetching the whole wiki.
#
# See https://tech.helloally.ai/#/wiki/contributing/docs-system.md

on:
  pull_request:
    paths: ["wiki/**", "scripts/gen-routing.py"]
  push:
    branches: [main]
    paths: ["wiki/**", "scripts/gen-routing.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert generated index is current
        run: python3 scripts/gen-routing.py --check

  distribute:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [ally-be, ally-ai, ally-ai-learn, ally-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate index
        run: python3 scripts/gen-routing.py

      # A short-lived installation token, scoped to just this matrix repo. Not a PAT: the
      # commits are authored by ally-docs-bot[bot], so nobody's contribution graph carries
      # work they didn't do.
      - name: Mint a token for the target repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
          owner: HelloAllyTech
          repositories: ${{ matrix.repo }}

      - name: Check out target repo
        uses: actions/checkout@v4
        with:
          repository: helloallytech/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Copy index onto one reusable PR if it changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          cp wiki/ROUTING.md "target/WIKI-ROUTING.md"
          cd target

          if git diff --quiet -- WIKI-ROUTING.md; then
            echo "No change for $TARGET."
            exit 0
          fi

          # One long-lived branch per target, force-pushed, rather than a branch per wiki
          # commit. Each run of this is a full regeneration that supersedes the last, so a
          # branch per commit produces a queue of stale snapshots that can only grow — it
          # reached 19 per repo before anyone noticed. At most one sync PR is open per repo
          # now, and it is always the current index.
          BRANCH="chore/sync-wiki-routing"
          # The App's own noreply address, so the commit links to ally-docs-bot[bot]
          # instead of showing as an unattributed ghost author.
          git config user.name  "ally-docs-bot[bot]"
          git config user.email "314168265+ally-docs-bot[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add WIKI-ROUTING.md
          git commit -m "chore: sync wiki routing index

          Generated from wiki page frontmatter at helloallytech.github.io@${GITHUB_SHA::7}.
          Do not edit by hand — edit the page frontmatter instead."

          # Fail the job only when the regenerated index would be *lost*. Anything that
          # leaves it captured on a PR is a success, even if it still needs a human.
          if ! push_log="$(git push --force origin "HEAD:refs/heads/$BRANCH" 2>&1)"; then
            echo "::error::Could not push the routing index branch to $TARGET — $push_log"
            exit 1
          fi

          PR_URL="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$PR_URL" ]; then
            if ! PR_URL="$(gh pr create \
              --title "chore: sync wiki routing index" \
              --body "Regenerated \`WIKI-ROUTING.md\` from wiki page frontmatter.

          This branch is reused and force-pushed on every wiki change, so it always holds the
          current index — there is never more than one of these open per repo.

          This file is generated. To change it, edit the frontmatter of the wiki page it
          describes — see [the docs system](https://tech.helloally.ai/#/wiki/contributing/docs-system.md).

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" \
              --label "docs:skip" \
              --head "$BRANCH" 2>&1)"; then
              echo "::error::Could not open a sync PR for $TARGET — $PR_URL"
              exit 1
            fi
          fi

          # Land it where nothing blocks that. Nobody can meaningfully review a regenerated
          # index, so a merge without a human is the goal — but an App cannot approve its
          # own pull request, and neither of the two protection exemptions available on a
          # classic protected branch gets around that:
          #   * bypass_pull_request_allowances waives "must use a PR", not the required
          #     review, so auto-merge stays armed and never fires;
          #   * pushing direct with that bypass is refused by the required status check
          #     itself (GH006, "Required status check ... is expected"), because the check
          #     cannot run before the ref moves.
          # A repository *ruleset* bypass covers required reviews and would close this; so
          # would a second App whose only job is approving this PR. Until one of those
          # exists, protected repos land this by hand — which is fine now that the queue
          # cannot grow past one.
          if gh pr merge --auto --squash "$PR_URL" >/dev/null 2>&1 \
            || gh pr merge --squash "$PR_URL" >/dev/null 2>&1; then
            echo "Merged or queued $PR_URL."
          else
            echo "::notice::$PR_URL holds the current index and is waiting on a human review."
          fi
