version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    # Copy env_sample to .env before running to provide all required variables
    env_file:
      - .env
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-ally-learn-core}  # Set in .env or use default
      # GOOGLE_APPLICATION_CREDENTIALS not set - will use Application Default Credentials from mounted volume
    ports:
      - '8002:8000'
    volumes:
      - .:/app  # Mount code directory for live code changes
      - ~/.config/gcloud:/root/.config/gcloud:ro  # Mount Application Default Credentials for Google Cloud
    depends_on:
      localstack:
        condition: service_healthy
    restart: on-failure

  localstack:
    image: localstack/localstack:3.0
    container_name: ally_learn_localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_DEFAULT_OUTPUT: json
      SERVICES: ses,s3,lambda,logs,sqs
      DEBUG: 1
      DATA_DIR: /tmp/localstack/ally-learn-data
      DOCKER_HOST: unix:///var/run/docker.sock
      HOST_TMP_FOLDER: ${TMPDIR:-/tmp}/localstack
      LOCALSTACK_WEB_UI: 1
      SES_FROM_EMAIL: noreply@localhost.localstack.cloud
      SES_RETURN_PATH: noreply@localhost.localstack.cloud
      # Pass queue name from .env file if available
      SQS_MESSAGE_EVENT_QUEUE_NAME: ${SQS_MESSAGE_EVENT_QUEUE_NAME:-message-event-queue}
    ports:
      - '4566:4566'
      - '4510-4559:4510-4559'
      - '8080:8080'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - localstack_data:/tmp/localstack-ally-learn
      - './localstack_bootstrap:/etc/localstack/init/ready.d'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  localstack_data:
    driver: local
