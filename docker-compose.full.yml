version: '3.8'

services:
  ally-ai-learn-core:
    build:
      context: .
      dockerfile: dockerfile
    # Copy env_sample to .env before running to provide all required variables
    env_file:
      - .env
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
    ports:
      - '8002:8000'
    depends_on:
      localstack:
        condition: service_healthy
    restart: on-failure

  localstack:
    image: localstack/localstack:3.0
    container_name: ally_learn_localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-south-1
      AWS_DEFAULT_OUTPUT: json
      SERVICES: ses,s3,lambda,logs,sqs
      DEBUG: 1
      DATA_DIR: /tmp/localstack/ally-learn-data
      DOCKER_HOST: unix:///var/run/docker.sock
      HOST_TMP_FOLDER: ${TMPDIR:-/tmp}/localstack
      LOCALSTACK_WEB_UI: 1
      SES_FROM_EMAIL: noreply@localhost.localstack.cloud
      SES_RETURN_PATH: noreply@localhost.localstack.cloud
    ports:
      - '4566:4566'
      - '4510-4559:4510-4559'
      - '8080:8080'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - localstack_data:/tmp/localstack-ally-learn
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  localstack_data:
    driver: local

