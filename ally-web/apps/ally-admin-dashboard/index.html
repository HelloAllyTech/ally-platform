<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `/b/<slug>` is the bot page (b.html). Deployed, the CDN answers unknown paths with this
         file, so hand over here before the dashboard loads: write b.html into the same document.
         Unlike a redirect, that keeps the URL, the referrer and ancestorOrigins, which the
         embedded widget's host check reads (src/botPage/embed.ts). The <plaintext> turns the rest
         of this file into inert text so the dashboard never runs; window.stop() would instead
         abort the parser, and document.open() is then a no-op. Locally the botPageRoutes
         middleware in vite.config.ts serves b.html directly. -->
    <script>
      (function () {
        var base = "%BASE_URL%".replace(/\/$/, "");
        var path = location.pathname;
        if (path.indexOf(base) === 0) path = path.slice(base.length);
        if (!/^\/b\/[^/]+\/?$/.test(path)) return;
        document.write("<plaintext hidden>");
        var write = function (html) {
          document.open();
          document.write(html);
          document.close();
        };
        fetch(base + "/b.html", { cache: "no-cache" })
          .then(function (res) {
            if (!res.ok) throw new Error(String(res.status));
            return res.text();
          })
          .then(write)
          .catch(function () {
            write(
              "<!doctype html><title>Chat</title><p>This page couldn't load. Please refresh.</p>",
            );
          });
      })();
    </script>
    <title>Ally Admin</title>
    <base href="%BASE_URL%" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="%BASE_URL%favicon.ico?v=1" sizes="any" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,arrow_back,auto_awesome,bug_report,change_history,flag,person,settings,sort,sticky_note,terminal,tips_and_updates,vertical_align_top"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Apply the saved light/dark choice before first paint, so a dark-mode reload never
         flashes white. Same key as src/hooks/useColorMode.ts; main.tsx re-applies it. -->
    <script>
      try {
        if (localStorage.getItem("ally-admin-color-mode") === "dark") {
          document.documentElement.classList.add("dark", "cds--g100");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
