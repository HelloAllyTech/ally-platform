name: "Build and push image"
description: "Build and push new images to ECR"
inputs:
  aws-role:
    required: true
    description: "AWS ROLE"
  aws-region:
    required: true
    description: "AWS REGION"
  ecr-repository:
    required: true
    description: "REPOSITORY OF THE IMAGE"
  release-tag:
    required: true
    description: "RELEASE TAG"
  environment-bucket:
    required: true
    description: "ENVIRONMENT BUCKET"
  s3-env-files:
    required: false
    description: "Multiline string of S3 files to download. Each line is a path inside the environment bucket. Ex: 'core/jwk.access.json\ncore/jwk.refresh.json'"
    default: ""
  build-platform:
    required: false
    description: "BUILD PLATFORM"
    default: "linux/amd64"
  build-path:
    required: false
    description: "BUILD PATH"
    default: ".dockerfile"
  gcp-project-id:
    required: false
    description: "GCP Project ID for Workload Identity Federation"
  gcp-wif-provider:
    required: false
    description: "GCP Workload Identity Federation Provider path"
  gcp-service-account:
    required: false
    description: "GCP Service Account email for Workload Identity Federation"
outputs:
  APP_IMAGE:
    description: "App image"
    value: ${{ steps.image.outputs.APP_IMAGE }}
runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}

    - name: Authenticate to Google Cloud using Workload Identity Federation
      if: inputs.gcp-project-id != '' && inputs.gcp-wif-provider != '' && inputs.gcp-service-account != ''
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.gcp-wif-provider }}
        service_account: ${{ inputs.gcp-service-account }}

    - name: Set up Google Cloud SDK
      if: inputs.gcp-project-id != '' && inputs.gcp-wif-provider != '' && inputs.gcp-service-account != ''
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ inputs.gcp-project-id }}

    - name: Amazon ECR Login
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1.7.0

    - name: Download environment files from S3
      if: inputs.s3-env-files != ''
      shell: bash
      run: |
        echo "${{ inputs.s3-env-files }}" | while IFS= read -r file_path; do
          if [ -n "$file_path" ]; then
            destination_file=${file_path##*/}
            echo "Downloading s3://${{ inputs.environment-bucket }}/$file_path to ./$destination_file"
            aws s3 cp "s3://${{ inputs.environment-bucket }}/$file_path" "./$destination_file"
          fi
        done

    - name: Build and push to Amazon ECR
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.build-path }}
        push: true
        platforms: ${{ inputs.build-platform }}
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ inputs.release-tag }}
          ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:latest

    - name: Output the image name
      id: image
      shell: bash
      run: |
        echo "APP_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ inputs.release-tag }}" >> $GITHUB_OUTPUT
