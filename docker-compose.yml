version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    # Remove the command override to use the CMD from the Dockerfile
    # This will run both the Uvicorn server and LiveKit worker
    restart: unless-stopped
