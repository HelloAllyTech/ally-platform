# Lima VM configuration for Ally development
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

cpus: 4
memory: "8GiB"
disk: "40GiB"

mounts:
  - location: "/Users/ajey/workspace/ally"
    writable: true
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux

      export DEBIAN_FRONTEND=noninteractive

      # Update system
      apt-get update
      apt-get upgrade -y

      # Essential build tools
      apt-get install -y \
        build-essential \
        curl \
        wget \
        git \
        unzip \
        zip \
        software-properties-common \
        apt-transport-https \
        ca-certificates \
        gnupg \
        lsb-release \
        pkg-config \
        libssl-dev \
        libffi-dev \
        zlib1g-dev \
        libbz2-dev \
        libreadline-dev \
        libsqlite3-dev \
        libncurses5-dev \
        libncursesw5-dev \
        xz-utils \
        tk-dev \
        liblzma-dev \
        libpq-dev \
        jq \
        make \
        ansible

      # ── Docker CE ──
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
        $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
        tee /etc/apt/sources-list.d/docker.list > /dev/null
      # Fix: use sources.list.d not sources-list.d
      mv /etc/apt/sources-list.d/docker.list /etc/apt/sources.list.d/docker.list 2>/dev/null || true
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      # Add default lima user to docker group
      usermod -aG docker $(getent passwd 1000 | cut -d: -f1) || true

      # Enable docker
      systemctl enable docker
      systemctl start docker

      # ── PostgreSQL client ──
      apt-get install -y postgresql-client

      # ── Redis tools ──
      apt-get install -y redis-tools

  - mode: user
    script: |
      #!/bin/bash
      set -eux

      # ── NVM + Node.js ──
      export NVM_DIR="$HOME/.nvm"
      if [ ! -d "$NVM_DIR" ]; then
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
      fi
      source "$NVM_DIR/nvm.sh"

      # Node 24 (ally-be) - set as default
      nvm install 24
      nvm alias default 24

      # Node 22 (ally-web)
      nvm install 22

      # ── Python 3.12 via pyenv ──
      if [ ! -d "$HOME/.pyenv" ]; then
        curl https://pyenv.run | bash
      fi
      export PYENV_ROOT="$HOME/.pyenv"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"

      pyenv install -s 3.12.8
      pyenv global 3.12.8

      # ── Poetry ──
      curl -sSL https://install.python-poetry.org | python3 -
      export PATH="$HOME/.local/bin:$PATH"

      # ── Pre-commit ──
      pip install pre-commit

      # ── Ruby (for iOS/Jekyll) ──
      # System ruby from apt is sufficient
      # Already installed via build-essential deps

      # ── Shell profile setup ──
      cat >> ~/.bashrc << 'PROFILE'

      # NVM
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

      # Pyenv
      export PYENV_ROOT="$HOME/.pyenv"
      [[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"

      # Poetry
      export PATH="$HOME/.local/bin:$PATH"
      PROFILE

probes:
  - script: |
      #!/bin/bash
      set -eux
      if ! timeout 30s bash -c "until command -v docker >/dev/null 2>&1; do sleep 3; done"; then
        echo >&2 "docker is not installed yet"
        exit 1
      fi
    description: "docker to be installed"
    hint: "See /var/log/cloud-init-output.log in the guest"

hostResolver:
  enabled: true
  hosts:
    host.docker.internal: host.lima.internal

portForwards: []
