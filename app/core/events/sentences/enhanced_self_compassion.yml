id: enhanced-self-compassion
sentences:
  - "Try speaking to yourself as you would to a friend in this situation."
  - "It's okay to be imperfect; everyone struggles sometimes."
  - "Be gentle with yourself — you're doing the best you can."
  - "Your feelings are valid, and it's okay to acknowledge them."
  - "Remember to treat yourself with the same kindness you show others."
  - "Allow yourself to feel what you're feeling without judgment."
  - "Try to notice when you're being self-critical and soften that tone."
  - "Forgive yourself for mistakes — they don't define you."
  - "You deserve the same compassion you offer to others."
  - "Be patient with yourself as you navigate this challenge."
  - "Notice the effort you're making, even if the outcome isn't perfect."
  - "Treat yourself with understanding, not harsh criticism."
  - "It's okay to give yourself permission to rest and recover."
  - "Try replacing self-judgment with curiosity and care."
  - "Your humanity includes imperfection, and that's normal."
  - "Speak to yourself in ways that support growth, not shame."
  - "Recognize that you're worthy of kindness, even in difficult moments."
  - "Try noticing when you're blaming yourself and offer compassion instead."
  - "Treat setbacks as opportunities to learn rather than proof of failure."
  - "Allow yourself the same empathy you would offer someone you love."
  - "Be aware of your inner critic and respond with self-kindness."
  - "It's okay to prioritize your own well-being and care."
  - "Notice how harsh self-criticism affects you and soften it."
  - "Your struggles don't make you less worthy of compassion."
  - "Try validating your own emotions instead of dismissing them."
  - "Offer yourself patience when things feel overwhelming."
  - "Recognize that mistakes are part of learning and growing."
  - "Treat yourself as a work in progress, not a finished failure."
  - "Be mindful of your self-talk and shift it toward kindness."
  - "You can acknowledge flaws without diminishing your value."
