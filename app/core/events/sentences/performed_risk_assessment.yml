id: performed-risk-assessment
sentences:
  - "Sometimes when people feel as overwhelmed as you've described, they may have thoughts of not wanting to live. Has that been true for you?"
  - "Many people in your situation struggle with thoughts of hurting themselves. I wonder if that has come up for you."
  - "Given how much you've been going through, I'd like to ask about your safety. Have you had any thoughts about ending your life?"
  - "It sounds really painful. I'm wondering if you've ever wished you could just go to sleep and not wake up."
  - "When things feel at their worst, what kinds of thoughts come up for you?"
  - "Can you tell me more about the times when you've thought life isn't worth living?"
  - "What do those thoughts usually sound like inside your head?"
  - "How often do these thoughts come, and how strong are they when they appear?"
  - "Have you ever thought about acting on those thoughts?"
  - "When those thoughts are present, how close have you felt to acting on them?"
  - "Have you thought about how you might hurt yourself?"
  - "Do you have access to the things you might use?"
  - "What has stopped you from acting on those thoughts so far?"
  - "Have you ever tried to harm yourself in the past?"
  - "What happened then, and what helped you survive?"
  - "Have the thoughts felt stronger or different recently compared to before?"
  - "When was the last time you felt close to acting on them?"
  - "What helps you stay safe when those thoughts come up?"
  - "Who or what helps you get through the toughest moments?"
  - "What reasons do you find to keep going, even when it's very hard?"
  - "What might make it easier for you to reach out if you're struggling?"
  - "If the urges increased, what could we put in place to help you stay safe?"
  - "What steps could we take together to help you feel safer right now?"
  - "Would it help if we put together a safety plan for moments when these thoughts get stronger?"
  - "What would be the first thing you'd do if you felt unsafe with your thoughts?"
  - "Who could you contact if things became unmanageable?"
