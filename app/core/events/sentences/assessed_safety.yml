id: assessed-safety
sentences:
  - "Have there been any instances where you have felt unsafe at home or feared any punishment?"
  - "Can you tell me how safe you feel at home?"
  - "Are there times at home when you feel threatened or unsafe?"
  - "How do things feel for you in your household right now?"
  - "Is there anyone at home who makes you feel at risk?"
  - "Can you describe situations at home that feel unsafe?"
  - "Have there been any recent incidents at home that worried you?"
  - "How often do you feel secure in your living environment?"
  - "Are there areas in your home where you feel vulnerable?"
  - "Do you ever fear for your physical or emotional safety at home?"
  - "Who in your household do you feel safe with, and who do you not?"
  - "Can you tell me what makes your home feel safe or unsafe?"
  - "Have you ever felt unsafe at home in the past?"
  - "Are there patterns in your home environment that feel threatening?"
  - "Do you have a plan for what to do if you ever feel unsafe at home?"
  - "Is there anyone at home who you worry might hurt you or others?"
  - "How do you usually protect yourself at home if you feel unsafe?"
  - "Are there things in your home that make you feel uneasy?"
  - "Do you feel emotionally supported and safe at home?"
  - "Are there moments when you feel trapped or at risk at home?"
  - "How confident are you that you could get help if you felt unsafe at home?"
  - "Do you feel threatened by anyone in your household?"
  - "Are there times when you feel your home isn't a safe space?"
  - "How do you cope when situations at home feel unsafe?"
  - "Have you shared your feelings about safety at home with anyone?"
  - "Do you have resources or people you can reach out to if home feels unsafe?"
  - "Are there ongoing tensions at home that make you feel unsafe?"
  - "Have there been incidents at home that made you fear for your safety?"
  - "Can you describe what triggers fear or discomfort at home?"
  - "Do you feel safe expressing yourself at home?"
  - "How does the home environment affect your overall sense of safety?"
