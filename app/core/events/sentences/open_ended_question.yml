id: open-ended-question
sentences:
  - "What was that experience like for you?"
  - "How are you feeling about that right now?"
  - "What goes through your mind when that happens?"
  - "How do you make sense of that?"
  - "What's been hardest about this for you?"
  - "How do you usually cope when you feel that way?"
  - "What was it like growing up in that environment?"
  - "What do you want to get out of therapy?"
  - "How do you imagine things could be different?"
  - "What's most important to you in this situation?"
  - "What do you think triggered that response?"
  - "How do you feel when you're around your family?"
  - "What do you notice happening in your body right now?"
  - "What do you need most in this moment?"
  - "How has this been affecting your day-to-day life?"
  - "What do you wish your partner/friend/parent understood about you?"
  - "How do you usually respond when that comes up?"
  - "What would healing look like for you?"
  - "What thoughts came up for you just now?"
  - "How do you know when you're starting to feel overwhelmed?"
  - "What strengths have helped you in the past?"
  - "How would you describe your relationship with them?"
  - "What do you hope will change over time?"
  - "What do you notice about yourself in those moments?"
  - "How do you feel talking about this here with me?"
  - "What's something you haven't been able to tell anyone else?"
  - "How does this situation connect to your values?"
  - "What meaning does this experience hold for you?"
  - "What possibilities do you see for moving forward?"
  - "How do you feel about the progress you've made so far?"
