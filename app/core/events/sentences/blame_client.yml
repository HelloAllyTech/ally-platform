id: blame-client
sentences:
  - "You're the one causing these problems."
  - "If you really wanted to get better, you would've tried harder."
  - "You're not putting enough effort into therapy."
  - "Maybe you're just not committed to changing."
  - "You keep sabotaging yourself."
  - "You're choosing to feel this way."
  - "You must not want to get better if you're still struggling."
  - "You're making things harder than they need to be."
  - "You should know better by now."
  - "If you keep thinking negatively, of course you'll stay stuck."
  - "It's your fault that things haven't improved."
  - "You're too resistant to make progress."
  - "Maybe you don't really want help."
  - "You're bringing these issues on yourself."
  - "If you just followed my advice, you wouldn't have these problems."
  - "You've created your own mess."
  - "You're the common denominator in all your problems."
  - "You can't expect change if you won't change your attitude."
  - "You're the reason your relationships keep failing."
  - "You're not trying hard enough."
