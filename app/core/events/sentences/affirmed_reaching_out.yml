id: affirmed-reaching-out
sentences:
  - "It took courage to come here today."
  - "Reaching out for help is a strong step."
  - "You've done something important for yourself by being here."
  - "It's not easy to open up, and you chose to."
  - "Talking about this shows real strength."
  - "Coming here means you're taking your healing seriously."
  - "You're showing up for yourself in a meaningful way."
  - "It's brave to let someone else in on what you're going through."
  - "You've already done a lot by choosing to seek support."
  - "Sharing this with me is a powerful step forward."
  - "You made an important choice by not keeping this inside."
  - "It's a sign of self-awareness that you reached out."
  - "Showing up today is something to be proud of."
  - "You've taken an active role in caring for yourself."
  - "Opening up like this shows courage and honesty."
  - "Taking this step isn't easy, but you did it."
  - "You're showing commitment to your growth by being here."
  - "Allowing yourself to seek help shows strength, not weakness."
  - "You could have kept this to yourself, but you chose to share it."
  - "By reaching out, you've already started the process of change."
  - "You're demonstrating that you value your own well-being."
  - "Just coming here is a big achievement."
  - "You've taken a positive and important step."
  - "You're not facing this alone anymore, and that matters."
  - "It takes a lot of strength to ask for help, and you did."
  - "You made a choice to support yourself by being here."
  - "You've given yourself a chance to be heard."
  - "Reaching out is a sign that you care about yourself."
  - "Being here shows your resilience."
  - "Taking this step says a lot about your determination."
