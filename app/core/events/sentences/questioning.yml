id: questioning
sentences:
  - "What was that experience like for you?"
  - "How did that situation affect you?"
  - "What stands out to you about what happened?"
  - "How are you making sense of that right now?"
  - "What feelings come up as you talk about this?"
  - "How does this connect to other parts of your life?"
  - "What do you notice in yourself as you remember that moment?"
  - "How do you experience that in your body?"
  - "What was going through your mind at the time?"
  - "How do you usually respond when this happens?"
  - "What's the hardest part of this for you?"
  - "What do you wish had been different?"
  - "How does it feel to share this with me?"
  - "What do you need most when you feel this way?"
  - "How do you cope when this shows up?"
  - "What matters most to you in this situation?"
  - "What does this mean to you personally?"
  - "How does this affect your relationships?"
  - "What do you imagine might happen if things don't change?"
  - "What strengths have helped you get through similar times?"
  - "How do you want things to be different?"
  - "What do you think is keeping this pattern going?"
  - "What does that bring up for you right now?"
  - "How do you understand what triggered that reaction?"
  - "What do you notice about your thoughts in those moments?"
  - "How does this fit with what you've experienced before?"
  - "What do you think your younger self might say about this?"
  - "How do you decide what to do when you feel stuck?"
  - "What helps you feel safe when this comes up?"
  - "How do you imagine others see this situation?"
  - "What values feel most important to you here?"
  - "What makes this especially difficult for you?"
  - "How do you picture things if they got better?"
  - "What do you notice you avoid when this comes up?"
  - "How do you know when things are getting overwhelming?"
  - "What do you imagine is underneath this feeling?"
  - "How do you take care of yourself in those moments?"
  - "What surprised you most about what happened?"
  - "How does this connect to your sense of self?"
  - "What do you find yourself wishing for?"
  - "How did you learn to handle things this way?"
  - "What would it mean for you if this changed?"
  - "How do you usually know when something isn't right?"
  - "What feels most urgent for us to focus on?"
  - "What do you notice happens right before you feel this way?"
  - "How does this affect how you see yourself?"
  - "What does it look like when things go a little better?"
  - "What helps you feel understood?"
  - "What feels unfinished about this experience?"
  - "How do you think this is connected to past experiences?"
  - "What gives you hope when things feel hard?"
  - "How do you experience trust with people?"
  - "What makes you feel most supported?"
  - "How do you know when you're starting to shut down?"
  - "What do you think you need to move forward?"
  - "How does this experience shape the way you view others?"
  - "What feels most confusing about this situation?"
  - "What keeps this worry alive for you?"
  - "How do you think about yourself when this happens?"
  - "What do you imagine life would be like without this struggle?"
  - "What do you find helps you open up more?"
  - "How do you know when you're holding back?"
  - "What does your inner voice say in these moments?"
  - "How did you get through it at the time?"
  - "What helps you regain your balance when you feel off?"
  - "How do you experience closeness with others?"
  - "What do you want me to understand most about this?"
  - "How do you recognize when you need support?"
  - "What's the story you tell yourself about this?"
  - "How does it feel when you're not understood?"
  - "What would you like to change about how you respond?"
  - "How do you want to remember this part of your life?"
  - "What feels like the first step toward change?"
  - "How do you know when you're being too hard on yourself?"
  - "What's the most important thing I should hear from you right now?"
  - "How do you picture your future self handling this?"
  - "What do you notice about the way you talk to yourself?"
  - "How do you define healing for yourself?"
  - "What feels most difficult to put into words?"
  - "How do you want our time here to help you?"
  - "What patterns do you notice showing up again and again?"
  - "How do you decide who to trust?"
  - "What would make you feel more empowered here?"
  - "How does it feel in your body when you're anxious?"
  - "What story do you think this part of you is trying to tell?"
  - "How do you imagine things might shift with more support?"
  - "What feels most important to say out loud?"
  - "How do you know when something matters deeply to you?"
  - "What would you like to hold onto from this process?"
  - "How do you experience yourself when you're at your best?"
  - "What do you want your life to look like moving forward?"
  - "How do you imagine others might describe your strengths?"
  - "What makes you feel most like yourself?"
  - "How do you experience hope, even when things are tough?"
  - "What helps you stay connected to who you are?"
  - "How do you want to relate differently to this part of your life?"
  - "What feels possible for you right now?"
  - "How do you know when you're making progress?"
  - "What would it mean for you to let go of this?"
  - "How do you want to take care of yourself differently?"
  - "What feels unfinished between you and this experience?"
  - "How do you want to show up in your relationships?"
  - "What does feeling "enough" look like for you?"
  - "How do you want to use your voice in this process?"
