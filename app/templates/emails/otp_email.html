<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Your Login Code</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f8f9fa; padding: 30px; border-radius: 10px; text-align: center;">
        <h1 style="color: #333; margin-bottom: 20px;">Your Login Code</h1>
        <p style="color: #666; font-size: 16px; margin-bottom: 30px;">
            Use this code to complete your login to Ally Learn:
        </p>
        <div style="background-color: #007bff; color: white; font-size: 32px; font-weight: bold; 
                   padding: 20px; border-radius: 8px; letter-spacing: 8px; margin: 20px 0;">
            {otp_code}
        </div>
        <p style="color: #666; font-size: 14px; margin-top: 30px;">
            This code will expire in 10 minutes.<br>
            If you didn't request this code, please ignore this email.
        </p>
    </div>
</body>
</html>
