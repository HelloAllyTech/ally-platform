# Parity cases for scripts/agent_parity.py: the same payload goes to
# /api/v1/knowledge-agent/answer and /api/v1/agent/run.
#
# No Stage 1 question set existed, so these are written against the seven local
# "Ally FAQ –" library documents (knowledge source "selected", which ally-be sends
# with an unrestricted audience). `defaults` is merged under every case's `request`.

defaults:
  audience:
    unrestricted: true
  document_ids:
    - 6afbcba1-301c-46c8-86e7-1fcc13012b48  # About Ally
    - 41053646-499f-428a-aab0-e052c82d19a9  # Getting Access and Signing In
    - 88299893-4154-4f2f-a0f1-ed74815fefb2  # Privacy and Data
    - 9ba9b749-9f12-4678-aa1a-4f8b15656643  # Skills Lab Practice
    - cca393fe-4da9-47c4-bdaa-6ab6cb463b71  # Ally Assist Scribe
    - 416e79db-b780-4550-9cb5-42b2b00a57fe  # Help and Support
    - 7e50d289-8d6a-43a9-bafb-df22b242d897  # Progress, Badges and Streaks
  answer_mode: documents_only
  channel: whatsapp

cases:
  # --- 8 clear in-scope questions -------------------------------------------------
  - id: in-what-is-ally
    kind: in_scope
    request: {question: "What is Ally?"}
  - id: in-get-access
    kind: in_scope
    request: {question: "How do I get access to Ally?"}
  - id: in-assist-consent
    kind: in_scope
    request: {question: "Do I need consent to use Ally Assist in a session?"}
  - id: in-audio-stored
    kind: in_scope
    request: {question: "Does Ally store the audio of my real sessions?"}
  - id: in-roleplay
    kind: in_scope
    request: {question: "How does a Skills Lab roleplay work?"}
  - id: in-real-clients
    kind: in_scope
    request: {question: "Are the roleplay clients real people?"}
  - id: in-xp-levels
    kind: in_scope
    request: {question: "How do XP and levels work?"}
  - id: in-report-problem
    kind: in_scope
    request: {question: "How do I report a problem in the app?"}

  # --- 4 clearly out-of-scope questions (expect a gate decline) --------------------
  - id: out-weather
    kind: out_of_scope
    request: {question: "What will the weather be in Mumbai tomorrow?"}
  - id: out-recipe
    kind: out_of_scope
    request: {question: "Give me a recipe for paneer butter masala."}
  - id: out-football
    kind: out_of_scope
    request: {question: "Who won the football World Cup in 2018?"}
  - id: out-tax
    kind: out_of_scope
    request: {question: "How do I file my income tax return online?"}

  # --- 3 non-English questions -----------------------------------------------------
  - id: lang-hindi
    kind: non_english
    request: {question: "Ally क्या है और यह किसके लिए है?"}
  - id: lang-marathi
    kind: non_english
    request: {question: "स्किल्स लॅबमधील रोलप्ले कसा चालतो?"}
  - id: lang-hinglish
    kind: non_english
    request: {question: "Ally Assist meri session ki audio store karta hai kya?"}

  # --- 2 ambiguous questions (clarify allowed) -------------------------------------
  - id: amb-help-client
    kind: ambiguous
    request: {question: "help with a client"}
  - id: amb-it-doesnt-work
    kind: ambiguous
    request: {question: "it doesn't work"}

  # --- 2 documents_and_general cases -------------------------------------------------
  - id: gen-in-scope
    kind: general
    request: {question: "What is Ally Assist?", answer_mode: documents_and_general}
  - id: gen-out-of-scope
    kind: general
    request:
      question: "What is active listening?"
      answer_mode: documents_and_general

  # --- 1 empty document selection (must search nothing and decline) ------------------
  # ally-be substitutes this placeholder for an empty selection (NO_DOCUMENTS in
  # chatbot-engine.service.ts), so this is exactly what an empty bot sends.
  - id: empty-selection
    kind: empty_selection
    request:
      question: "What is Ally?"
      document_ids: ["00000000-0000-0000-0000-000000000000"]

  # --- extras ------------------------------------------------------------------------
  - id: extra-other-tenant-doc
    kind: out_of_scope
    request: {question: "How do I submit my Northwind timesheet?"}
  - id: extra-follow-up
    kind: in_scope
    request:
      question: "And is it free?"
      history:
        - {role: user, content: "What is Ally?"}
        - {role: assistant, content: "Ally is a not-for-profit platform that helps people who support others practise hard conversations."}
