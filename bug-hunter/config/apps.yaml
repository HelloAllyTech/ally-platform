# The five apps the bug hunter works on. Paths are relative to the ally-platform root.
# Commands copy the root CLAUDE.md "Verified commands" and the test-*.yml workflows;
# where the spec (docs/bug-hunter/spec.md §9) differed from CI, CI won. See
# docs/bug-hunter/notes/CHUNK-01-NOTES.md for the list of corrections.
#
# Placeholders in test_one: {file} = test file path relative to the app, {name} = test name.
apps:
  ally-be:
    path: ally-be
    lang: typescript
    test: "npm test -- --forceExit --detectOpenHandles"
    test_one: "npx jest {file} -t {name} --forceExit"
    lint: "npm run lint"
    typecheck: "npm run typecheck"
    # Jest rootDir is src with testRegex .*\.spec\.ts$; there is no top-level test/.
    test_dirs: ["src/**/test/", "src/**/*.spec.ts"]
    risk_paths:
      - src/auth/
      - src/authorization/
      - src/tenant/
      - src/user/
      - src/audit/
      - src/database/migrations/
      - src/config/
      - src/rate-limit/
      - src/conversational-guardrails/
  ally-web:
    path: ally-web
    lang: typescript
    test: "npm test"
    # Single-test command for Vitest-under-Nx is project-specific; chunk 02 (runner) decides it.
    lint: "npm run lint && npm run format:check && npm run lint:colors"
    typecheck: >-
      npx tsc --noEmit -p apps/ally-admin-dashboard/tsconfig.app.json
      && npx tsc --noEmit -p apps/ally-helpline-dashboard/tsconfig.app.json
      && npx tsc --noEmit -p libs/ui-shared/tsconfig.lib.json
    test_dirs: ["**/__tests__/", "**/*.test.ts", "**/*.test.tsx"]
    # Concrete auth and permission files rather than **/*Auth*, which also matched
    # agentAuthored.ts and useContentAuthoring.ts.
    risk_paths:
      - "**/auth/**"
      - "**/api/auth.ts"
      - "**/types/auth.ts"
      - "**/routes/PrivateRouteLayout*"
      - "**/routes/**/PermissionGuardedRoute*"
      - "**/permission-guard/**"
      - "**/constants/permissions.ts"
      - "**/utils/permission.ts"
      - "**/utils/permissions.ts"
  ally-ai:
    path: ally-ai
    lang: python
    test: "poetry run pytest tests/ -v"
    test_one: "poetry run pytest {file} -k {name} -v"
    lint: "poetry run flake8"
    test_dirs: ["tests/"]
    risk_paths:
      - app/core/phi_logger.py
      - app/core/phi_events.py
      - app/core/config.py
      - app/migrations/
      - app/middleware.py
      - app/core/transcriptions/utils/phi_logger.py
      - app/core/transcriptions/utils/phi_events.py
  ally-ai-learn:
    path: ally-ai-learn
    lang: python
    test: "poetry run python -m pytest tests/ -v"
    test_one: "poetry run python -m pytest {file} -k {name} -v"
    lint: "poetry run flake8"
    test_dirs: ["tests/"]
    risk_paths:
      - app/core/config.py
      - app/middleware.py
      - app/core/emergency_finalize.py
  ally-mobile:
    path: ally-mobile
    lang: dart
    test: "flutter test"
    test_one: "flutter test {file} --name {name}"
    lint: "flutter analyze"
    test_dirs: ["test/"]
    risk_paths:
      - lib/core/auth/
      - lib/core/network/
      - lib/core/config/
      - ios/
      - android/
    notes: "Never run dart format on this app."

global_risk_paths:
  - "**/package.json"
  - "**/pyproject.toml"
  - "**/pubspec.yaml"
  - "**/Dockerfile*"
  - "**/*compose*.y*ml"
  - ".github/**"
